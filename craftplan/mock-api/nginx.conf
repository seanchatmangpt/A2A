events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/json;

    server {
        listen 80;
        server_name localhost;

        # Mock health endpoint
        location /api/health {
            default_type application/json;
            add_header Content-Type application/json;
            return 200 '{"status":"ok","service":"mock-craftplan-api","timestamp":"2024-01-01T00:00:00Z"}';
        }

        # Mock products endpoint
        location /api/products {
            default_type application/json;
            add_header Content-Type application/json;
            return 200 '{
                "products": [
                    {"id": 1, "name": "Handmade Ceramics", "price": 45.00, "stock": 100},
                    {"id": 2, "name": "Wooden Furniture", "price": 299.00, "stock": 25},
                    {"id": 3, "name": "Knitwear", "price": 89.00, "stock": 75}
                ]
            }';
        }

        # Mock orders endpoint
        location /api/orders {
            default_type application/json;
            add_header Content-Type application/json;
            return 200 '{
                "orders": [
                    {"id": "ORD001", "customer": "John Doe", "amount": 134.00, "status": "completed"},
                    {"id": "ORD002", "customer": "Jane Smith", "amount": 89.00, "status": "processing"}
                ]
            }';
        }

        # Mock customers endpoint
        location /api/customers {
            default_type application/json;
            add_header Content-Type application/json;
            return 200 '{
                "customers": [
                    {"id": "CUST001", "name": "John Doe", "email": "john@example.com", "total_orders": 5},
                    {"id": "CUST002", "name": "Jane Smith", "email": "jane@example.com", "total_orders": 3}
                ]
            }';
        }

        # Serve static files
        location / {
            root /usr/share/nginx/html;
            index index.html;
        }
    }
}