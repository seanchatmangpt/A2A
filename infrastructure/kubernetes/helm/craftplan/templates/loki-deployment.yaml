{{- if .Values.monitoring.enabled -}}
{{- if .Values.monitoring.loki.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "craftplan.fullname" . }}-loki
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "craftplan.labels" . | nindent 4 }}
    app.kubernetes.io/name: loki
  annotations:
    {{- if .Values.global.deploymentStrategy }}
    deployment.kubernetes.io/revision: "{{ .Values.global.deploymentStrategy.revision | default 1 }}"
    {{- end }}
    {{- if .Values.monitoring.loki.annotations }}
    {{- toYaml .Values.monitoring.loki.annotations | nindent 4 }}
    {{- end }}
spec:
  replicas: 1
  strategy:
    type: {{ .Values.global.deploymentStrategy.type | default "RollingUpdate" }}
    rollingUpdate:
      maxSurge: {{ .Values.global.deploymentStrategy.rollingUpdate.maxSurge | default "25%" }}
      maxUnavailable: {{ .Values.global.deploymentStrategy.rollingUpdate.maxUnavailable | default "0" }}
  selector:
    matchLabels:
      {{- include "craftplan.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: loki
  template:
    metadata:
      labels:
        {{- include "craftplan.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/name: loki
        app.kubernetes.io/component: loki
        {{- if .Values.monitoring.loki.podLabels }}
        {{- toYaml .Values.monitoring.loki.podLabels | nindent 8 }}
        {{- end }}
      annotations:
        {{- if .Values.monitoring.loki.podAnnotations }}
        {{- toYaml .Values.monitoring.loki.podAnnotations | nindent 8 }}
        {{- end }}
        checksum/config: {{ include "craftplan.config" . | sha256sum }}
    spec:
      securityContext:
        {{- include "craftplan.securityContext" . | nindent 8 }}
      containers:
        - name: loki
          image: "{{ .Values.monitoring.loki.image.repository }}:{{ .Values.monitoring.loki.image.tag }}"
          imagePullPolicy: {{ .Values.monitoring.loki.image.pullPolicy }}
          securityContext:
            {{- include "craftplan.securityContext" . | nindent 12 }}
          ports:
            - name: http
              containerPort: 3100
              protocol: TCP
          args:
            - -config.file=/etc/loki/loki.yml
            - -target=all
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          {{- if .Values.monitoring.loki.resources }}
          resources:
            {{- toYaml .Values.monitoring.loki.resources | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/loki
              readOnly: true
            - name: storage
              mountPath: /data
      volumes:
        - name: config
          configMap:
            name: {{ include "craftplan.configMapName" . }}-loki
        - name: storage
          emptyDir: {}
{{- end }}
{{- end }}