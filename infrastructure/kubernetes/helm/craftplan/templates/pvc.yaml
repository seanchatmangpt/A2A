{{- if .Values.postgres.persistence.enabled -}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "craftplan.pvcName" . }}-postgres
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "craftplan.labels" . | nindent 4 }}
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: postgres
spec:
  accessModes:
    - {{ .Values.storage.accessModes | first | default "ReadWriteOnce" }}
  resources:
    requests:
      storage: {{ .Values.postgres.persistence.size | default "10Gi" }}
  storageClassName: {{ .Values.storage.class | default "standard" }}
{{- end }}

