{{- if .Values.global.secrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "craftplan.secretName" . }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "craftplan.labels" . | nindent 4 }}
    app.kubernetes.io/name: craftplan
type: Opaque
data:
  {{- if .Values.secrets.postgres.password }}
  postgres.password: {{ .Values.secrets.postgres.password | b64enc }}
  {{- end }}
  {{- if .Values.secrets.redis.password }}
  redis.password: {{ .Values.secrets.redis.password | b64enc }}
  {{- end }}
  {{- if .Values.secrets.minio.accessKey }}
  minio.accessKey: {{ .Values.secrets.minio.accessKey | b64enc }}
  {{- end }}
  {{- if .Values.secrets.minio.secretKey }}
  minio.secretKey: {{ .Values.secrets.minio.secretKey | b64enc }}
  {{- end }}
  {{- if .Values.secrets.craftplan.secretKeyBase }}
  craftplan.secretKeyBase: {{ .Values.secrets.craftplan.secretKeyBase | b64enc }}
  {{- end }}
  {{- if .Values.secrets.craftplan.jwtSecret }}
  craftplan.jwtSecret: {{ .Values.secrets.craftplan.jwtSecret | b64enc }}
  {{- end }}
  {{- if .Values.secrets.mcpServer.craftplanToken }}
  mcpServer.craftplanToken: {{ .Values.secrets.mcpServer.craftplanToken | b64enc }}
  {{- end }}
  {{- if .Values.secrets.mcpServer.mcpSecret }}
  mcpServer.mcpSecret: {{ .Values.secrets.mcpServer.mcpSecret | b64enc }}
  {{- end }}
  {{- if .Values.secrets.a2aAgent.mcpToken }}
  a2aAgent.mcpToken: {{ .Values.secrets.a2aAgent.mcpToken | b64enc }}
  {{- end }}
  {{- if .Values.secrets.elrmcp.erlmcpSecret }}
  elrmcp.erlmcpSecret: {{ .Values.secrets.elrmcp.erlmcpSecret | b64enc }}
  {{- end }}
  {{- if .Values.secrets.grafana.adminPassword }}
  grafana.adminPassword: {{ .Values.secrets.grafana.adminPassword | b64enc }}
  {{- end }}
{{- end }}