{{- if .Values.secrets.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "a2a.fullname" . }}-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "a2a.labels" . | nindent 4 }}
    app.kubernetes.io/component: secret
  annotations:
    {{- if .Values.secrets.gcpSecretManager.enabled }}
    # GCP Secret Manager integration with Workload Identity
    iam.gke.io/gcp-service-account: {{ .Values.secrets.gcpSecretManager.serviceAccount | quote }}
    {{- end }}
    marketplace.cloud.google.com/deploy-info: '{"partner_id":"{{ .Values.marketplace.partnerId }}","product_id":"{{ .Values.marketplace.solutionId }}","partner_name":"A2A Protocol"}'
type: Opaque
data:
  {{- if .Values.secrets.data }}
  {{- range $key, $value := .Values.secrets.data }}
  {{ $key }}: {{ $value | b64enc | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.secrets.stringData }}
  {{- range $key, $value := .Values.secrets.stringData }}
  {{ $key }}: {{ $value | b64enc | quote }}
  {{- end }}
  {{- end }}
{{- end }}

{{- if .Values.secrets.gcpSecretManager.enabled }}
---
# External Secrets Operator integration for GCP Secret Manager
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: {{ include "a2a.fullname" . }}-gcp-secret-store
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "a2a.labels" . | nindent 4 }}
    app.kubernetes.io/component: secret-store
  annotations:
    marketplace.cloud.google.com/deploy-info: '{"partner_id":"{{ .Values.marketplace.partnerId }}","product_id":"{{ .Values.marketplace.solutionId }}","partner_name":"A2A Protocol"}'
spec:
  provider:
    gcpsm:
      {{- if .Values.secrets.gcpSecretManager.projectID }}
      projectID: {{ .Values.secrets.gcpSecretManager.projectID | quote }}
      {{- end }}
      auth:
        workloadIdentity:
          clusterLocation: {{ .Values.secrets.gcpSecretManager.clusterLocation | default "us-central1" | quote }}
          clusterName: {{ .Values.secrets.gcpSecretManager.clusterName | quote }}
          serviceAccountRef:
            name: {{ include "a2a.serviceAccountName" . }}
            namespace: {{ .Release.Namespace }}
---
# External Secret resource to sync from GCP Secret Manager
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "a2a.fullname" . }}-external-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "a2a.labels" . | nindent 4 }}
    app.kubernetes.io/component: external-secret
  annotations:
    marketplace.cloud.google.com/deploy-info: '{"partner_id":"{{ .Values.marketplace.partnerId }}","product_id":"{{ .Values.marketplace.solutionId }}","partner_name":"A2A Protocol"}'
spec:
  refreshInterval: {{ .Values.secrets.gcpSecretManager.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ include "a2a.fullname" . }}-gcp-secret-store
    kind: SecretStore
  target:
    name: {{ include "a2a.fullname" . }}-gcp-managed-secret
    creationPolicy: Owner
    deletionPolicy: {{ .Values.secrets.gcpSecretManager.deletionPolicy | default "Retain" }}
    template:
      type: Opaque
      metadata:
        labels:
          {{- include "a2a.labels" . | nindent 10 }}
          app.kubernetes.io/component: gcp-managed-secret
      {{- if .Values.secrets.gcpSecretManager.templateData }}
      data:
        {{- toYaml .Values.secrets.gcpSecretManager.templateData | nindent 8 }}
      {{- end }}
  {{- if .Values.secrets.gcpSecretManager.secrets }}
  data:
  {{- range .Values.secrets.gcpSecretManager.secrets }}
  - secretKey: {{ .secretKey | quote }}
    remoteRef:
      key: {{ .remoteKey | quote }}
      {{- if .version }}
      version: {{ .version | quote }}
      {{- end }}
      {{- if .property }}
      property: {{ .property | quote }}
      {{- end }}
  {{- end }}
  {{- end }}
  {{- if .Values.secrets.gcpSecretManager.dataFrom }}
  dataFrom:
  {{- range .Values.secrets.gcpSecretManager.dataFrom }}
  - extract:
      key: {{ .key | quote }}
      {{- if .version }}
      version: {{ .version | quote }}
      {{- end }}
      {{- if .conversionStrategy }}
      conversionStrategy: {{ .conversionStrategy | quote }}
      {{- end }}
  {{- end }}
  {{- end }}
{{- end }}

{{- if .Values.secrets.tls.enabled }}
---
# TLS Secret for secure communication
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "a2a.fullname" . }}-tls
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "a2a.labels" . | nindent 4 }}
    app.kubernetes.io/component: tls-secret
  annotations:
    marketplace.cloud.google.com/deploy-info: '{"partner_id":"{{ .Values.marketplace.partnerId }}","product_id":"{{ .Values.marketplace.solutionId }}","partner_name":"A2A Protocol"}'
type: kubernetes.io/tls
data:
  {{- if and .Values.secrets.tls.cert .Values.secrets.tls.key }}
  tls.crt: {{ .Values.secrets.tls.cert | b64enc | quote }}
  tls.key: {{ .Values.secrets.tls.key | b64enc | quote }}
  {{- else if .Values.secrets.tls.existingSecret }}
  # Using existing secret: {{ .Values.secrets.tls.existingSecret }}
  {{- end }}
  {{- if .Values.secrets.tls.ca }}
  ca.crt: {{ .Values.secrets.tls.ca | b64enc | quote }}
  {{- end }}
{{- end }}

{{- if .Values.secrets.imagePullSecret.enabled }}
---
# Docker registry credentials for private container images
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "a2a.fullname" . }}-registry-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "a2a.labels" . | nindent 4 }}
    app.kubernetes.io/component: registry-secret
  annotations:
    marketplace.cloud.google.com/deploy-info: '{"partner_id":"{{ .Values.marketplace.partnerId }}","product_id":"{{ .Values.marketplace.solutionId }}","partner_name":"A2A Protocol"}'
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ include "a2a.imagePullSecret" . | b64enc }}
{{- end }}

{{- if .Values.secrets.serviceAccountKey.enabled }}
---
# GCP Service Account Key (Legacy - prefer Workload Identity)
# Note: This is included for backwards compatibility but Workload Identity is recommended
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "a2a.fullname" . }}-gcp-sa-key
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "a2a.labels" . | nindent 4 }}
    app.kubernetes.io/component: service-account-key
  annotations:
    marketplace.cloud.google.com/deploy-info: '{"partner_id":"{{ .Values.marketplace.partnerId }}","product_id":"{{ .Values.marketplace.solutionId }}","partner_name":"A2A Protocol"}'
    description: "Legacy service account key - prefer Workload Identity for production"
type: Opaque
data:
  {{- if .Values.secrets.serviceAccountKey.keyJson }}
  key.json: {{ .Values.secrets.serviceAccountKey.keyJson | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.serviceAccountKey.projectId }}
  project_id: {{ .Values.secrets.serviceAccountKey.projectId | b64enc | quote }}
  {{- end }}
{{- end }}

{{- if .Values.secrets.database.enabled }}
---
# Database credentials secret
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "a2a.fullname" . }}-db-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "a2a.labels" . | nindent 4 }}
    app.kubernetes.io/component: database-secret
  annotations:
    marketplace.cloud.google.com/deploy-info: '{"partner_id":"{{ .Values.marketplace.partnerId }}","product_id":"{{ .Values.marketplace.solutionId }}","partner_name":"A2A Protocol"}'
type: Opaque
data:
  {{- if .Values.secrets.database.host }}
  DB_HOST: {{ .Values.secrets.database.host | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.database.port }}
  DB_PORT: {{ .Values.secrets.database.port | toString | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.database.name }}
  DB_NAME: {{ .Values.secrets.database.name | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.database.username }}
  DB_USERNAME: {{ .Values.secrets.database.username | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.database.password }}
  DB_PASSWORD: {{ .Values.secrets.database.password | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.database.connectionString }}
  DB_CONNECTION_STRING: {{ .Values.secrets.database.connectionString | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.database.sslMode }}
  DB_SSL_MODE: {{ .Values.secrets.database.sslMode | b64enc | quote }}
  {{- end }}
{{- end }}

{{- if .Values.secrets.api.enabled }}
---
# API keys and tokens secret
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "a2a.fullname" . }}-api-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "a2a.labels" . | nindent 4 }}
    app.kubernetes.io/component: api-secret
  annotations:
    marketplace.cloud.google.com/deploy-info: '{"partner_id":"{{ .Values.marketplace.partnerId }}","product_id":"{{ .Values.marketplace.solutionId }}","partner_name":"A2A Protocol"}'
type: Opaque
data:
  {{- if .Values.secrets.api.key }}
  API_KEY: {{ .Values.secrets.api.key | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.api.secret }}
  API_SECRET: {{ .Values.secrets.api.secret | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.api.token }}
  API_TOKEN: {{ .Values.secrets.api.token | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.api.jwtSecret }}
  JWT_SECRET: {{ .Values.secrets.api.jwtSecret | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.api.encryptionKey }}
  ENCRYPTION_KEY: {{ .Values.secrets.api.encryptionKey | b64enc | quote }}
  {{- end }}
  {{- range $key, $value := .Values.secrets.api.customKeys }}
  {{ $key }}: {{ $value | b64enc | quote }}
  {{- end }}
{{- end }}
