# =============================================================================
# Test Environment Variables and Secrets in Act
# =============================================================================
# This workflow validates that environment variables and secrets are properly
# passed to act workflows.
# =============================================================================

name: Test Secrets and Environment Variables

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

# Global environment variables (workflow-level)
env:
  WORKFLOW_GLOBAL_VAR: "global-value-from-workflow"
  OTP_VERSION: "28"
  REBAR3_VERSION: "3.24.0"

jobs:
  # =============================================================================
  # Job 1: Test Environment Variables
  # =============================================================================
  test-env-vars:
    name: Test Environment Variables
    runs-on: ubuntu-latest
    # Job-level environment variables
    env:
      JOB_VAR: "job-level-value"
      ANOTHER_JOB_VAR: "another-value"
    steps:
      - name: Display workflow environment variables
        run: |
          echo "=== Workflow Level Environment Variables ==="
          echo "WORKFLOW_GLOBAL_VAR=${WORKFLOW_GLOBAL_VAR}"
          echo "OTP_VERSION=${OTP_VERSION}"
          echo "REBAR3_VERSION=${REBAR3_VERSION}"
          echo ""

      - name: Display job environment variables
        run: |
          echo "=== Job Level Environment Variables ==="
          echo "JOB_VAR=${JOB_VAR}"
          echo "ANOTHER_JOB_VAR=${ANOTHER_JOB_VAR}"
          echo ""

      - name: Display GitHub context variables
        run: |
          echo "=== GitHub Context Variables ==="
          echo "GITHUB_ACTOR=${GITHUB_ACTOR}"
          echo "GITHUB_REPOSITORY=${GITHUB_REPOSITORY}"
          echo "GITHUB_REF=${GITHUB_REF}"
          echo "GITHUB_SHA=${GITHUB_SHA}"
          echo "GITHUB_RUN_ID=${GITHUB_RUN_ID}"
          echo "GITHUB_WORKFLOW=${GITHUB_WORKFLOW}"
          echo "RUNNER_OS=${RUNNER_OS}"
          echo "RUNNER_ARCH=${RUNNER_ARCH}"
          echo ""

      - name: Display all environment variables (safe ones)
        run: |
          echo "=== All Environment Variables (filtered) ==="
          env | grep -E "^(GITHUB_|RUNNER_|WORKFLOW_|JOB_|OTP_|REBAR3_)" || true
          echo ""

      - name: Export step-level environment variable
        run: |
          echo "STEP_VAR=step-level-value" >> $GITHUB_ENV
          echo "STEP_VAR exported to GITHUB_ENV"

      - name: Verify step-level environment variable
        run: |
          echo "STEP_VAR=${STEP_VAR}"

  # =============================================================================
  # Job 2: Test Secrets
  # =============================================================================
  test-secrets:
    name: Test Secrets
    runs-on: ubuntu-latest
    steps:
      - name: Check GITHUB_TOKEN presence
        run: |
          echo "=== Checking GITHUB_TOKEN ==="
          if [ -n "${{ secrets.GITHUB_TOKEN }}" ]; then
            echo "GITHUB_TOKEN is set (length: ${#SECRET})"
          else
            echo "GITHUB_TOKEN is NOT set"
          fi
          echo ""

      - name: Check custom secret
        run: |
          echo "=== Checking Custom Secret ==="
          if [ -n "${{ secrets.CUSTOM_SECRET }}" ]; then
            echo "CUSTOM_SECRET is set"
          else
            echo "CUSTOM_SECRET is NOT set (expected for act)"
          fi
          echo ""

      - name: Display secrets directory info
        run: |
          echo "=== Secrets Environment ==="
          echo "Checking for secret patterns in environment..."
          env | grep -i secret || echo "No secrets found in env"
          echo ""

  # =============================================================================
  # Job 3: Test Secret Passing to Container
  # =============================================================================
  test-secrets-in-container:
    name: Test Secrets in Container
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04
      env:
        CONTAINER_VAR: "container-level-value"
    steps:
      - name: Check environment in container
        run: |
          echo "=== Container Environment ==="
          echo "CONTAINER_VAR=${CONTAINER_VAR}"
          echo "WORKFLOW_GLOBAL_VAR=${WORKFLOW_GLOBAL_VAR}"
          echo "GITHUB_ACTOR=${GITHUB_ACTOR}"
          echo ""

      - name: Check secrets in container
        run: |
          echo "=== Secrets in Container ==="
          if [ -n "${{ secrets.GITHUB_TOKEN }}" ]; then
            echo "GITHUB_TOKEN accessible in container"
          else
            echo "GITHUB_TOKEN NOT accessible in container"
          fi
          echo ""

  # =============================================================================
  # Job 4: Test Composite Actions with Env/Secrets
  # =============================================================================
  test-composite-action:
    name: Test Composite Action
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test with composite action (if exists)
        uses: ./.github/actions/setup-beam
        with:
          otp-version: ${{ env.OTP_VERSION }}
        continue-on-error: true

  # =============================================================================
  # Job 5: Test Environment Variable Interpolation
  # =============================================================================
  test-interpolation:
    name: Test Variable Interpolation
    runs-on: ubuntu-latest
    env:
      BASE_VAR: "base"
      DERIVED_VAR: "${{ env.BASE_VAR }}-derived"
    steps:
      - name: Test interpolation
        run: |
          echo "=== Variable Interpolation ==="
          echo "BASE_VAR=${BASE_VAR}"
          echo "DERIVED_VAR=${DERIVED_VAR}"
          echo "OTP_VERSION=${OTP_VERSION}"
          echo ""

      - name: Test step with environment block
        env:
          STEP_LOCAL_VAR: "step-local"
        run: |
          echo "STEP_LOCAL_VAR=${STEP_LOCAL_VAR}"
          echo "BASE_VAR=${BASE_VAR}"
          echo ""

  # =============================================================================
  # Job 6: Test Multi-line Environment Variables
  # =============================================================================
  test-multiline-env:
    name: Test Multi-line Environment Variables
    runs-on: ubuntu-latest
    steps:
      - name: Set multi-line environment variable
        run: |
          {
            echo 'MULTI_LINE_VAR<<EOF'
            echo 'Line 1'
            echo 'Line 2'
            echo 'Line 3'
            echo 'EOF'
          } >> $GITHUB_ENV

      - name: Read multi-line environment variable
        run: |
          echo "=== Multi-line Variable ==="
          echo "${MULTI_LINE_VAR}"
          echo ""

  # =============================================================================
  # Job 7: Summary Report
  # =============================================================================
  summary:
    name: Summary Report
    runs-on: ubuntu-latest
    needs: [test-env-vars, test-secrets, test-secrets-in-container, test-composite-action, test-interpolation, test-multiline-env]
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "### Environment Variables and Secrets Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment Variables | ${{ needs.test-env-vars.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Secrets | ${{ needs.test-secrets.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Secrets in Container | ${{ needs.test-secrets-in-container.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Composite Action | ${{ needs.test-composite-action.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Variable Interpolation | ${{ needs.test-interpolation.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Multi-line Variables | ${{ needs.test-multiline-env.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**All tests completed**" >> $GITHUB_STEP_SUMMARY
