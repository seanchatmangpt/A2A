# =============================================================================
# Staging Environment Workflow for A2A Erlang
# =============================================================================
# This workflow runs CI/CD for the staging environment
# Designed to run locally with act
# =============================================================================

name: Staging Environment CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'erlang/a2a_erl/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - dev
          - staging
          - production

env:
  ENVIRONMENT: staging
  OTP_VERSION: '28'
  REBAR3_VERSION: '3.24.0'
  STAGING_URL: 'https://staging.a2a.example.com'

jobs:
  # =============================================================================
  # Staging: Build and Test
  # =============================================================================
  staging-build:
    name: Staging Build
    runs-on: ubuntu-latest
    container:
      image: erlang:28
      options: --tty
      env:
        DEPLOY_ENV: staging
        LOG_LEVEL: info
        API_URL: ${{ env.STAGING_URL }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Display staging environment
        run: |
          echo "=== Staging Environment ==="
          echo "ENVIRONMENT: $ENVIRONMENT"
          echo "DEPLOY_ENV: $DEPLOY_ENV"
          echo "STAGING_URL: $STAGING_URL"
          echo "API_URL: $API_URL"
          echo "OTP_VERSION: $OTP_VERSION"
          echo "LOG_LEVEL: $LOG_LEVEL"
          echo ""

      - name: Install rebar3
        run: |
          apt-get update && apt-get install -y git curl
          curl -O -L https://s3.amazonaws.com/rebar3/rebar3
          chmod +x rebar3
          mv rebar3 /usr/local/bin/rebar3
          echo "Rebar3 installed"

      - name: Compile application
        run: |
          cd erlang/a2a_erl
          script -q -c "rebar3 as staging compile" || rebar3 as staging compile || rebar3 compile || true

      - name: Run staging tests
        run: |
          cd erlang/a2a_erl
          mkdir -p results
          script -q -c "rebar3 ct --verbose false --logdir ./results --label staging" || rebar3 ct --verbose false --logdir ./results --label staging || true

      - name: Generate coverage
        if: success()
        run: |
          cd erlang/a2a_erl
          script -q -c "rebar3 cover -v" || rebar3 cover -v || true

  # =============================================================================
  # Staging: Integration Tests
  # =============================================================================
  staging-integration:
    name: Staging Integration Tests
    runs-on: ubuntu-latest
    container:
      image: erlang:28
      options: --tty
      env:
        DEPLOY_ENV: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install rebar3
        run: |
          apt-get update && apt-get install -y curl
          curl -O -L https://s3.amazonaws.com/rebar3/rebar3
          chmod +x rebar3
          mv rebar3 /usr/local/bin/rebar3
          echo "Rebar3 installed"

      - name: Run HTTP handler tests
        run: |
          cd erlang/a2a_erl
          rebar3 ct --suite test/a2a_http_handler_SUITE.erl || true

      - name: Run SSE handler tests
        run: |
          cd erlang/a2a_erl
          rebar3 ct --suite test/a2a_sse_handler_SUITE.erl || true

  # =============================================================================
  # Staging: Security Scan
  # =============================================================================
  staging-security:
    name: Staging Security Scan
    runs-on: ubuntu-latest
    container:
      image: erlang:28
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install rebar3
        run: |
          apt-get update && apt-get install -y curl
          curl -O -L https://s3.amazonaws.com/rebar3/rebar3
          chmod +x rebar3
          mv rebar3 /usr/local/bin/rebar3
          echo "Rebar3 installed"

      - name: Check dependencies
        run: |
          cd erlang/a2a_erl
          script -q -c "rebar3 tree" || rebar3 tree
          echo "=== Dependency check complete ==="

      - name: Basic security check
        run: |
          cd erlang/a2a_erl
          echo "Checking for hardcoded secrets..."
          grep -r "password\|secret\|api_key" src/ || echo "No obvious secrets found"

  # =============================================================================
  # Staging: Docker Build
  # =============================================================================
  staging-docker:
    name: Staging Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build staging Docker image
        run: |
          cd erlang/a2a_erl
          docker build -t a2a-erl:staging -f Dockerfile .
          docker images | grep a2a-erl

  # =============================================================================
  # Staging: Summary
  # =============================================================================
  staging-summary:
    name: Staging Summary
    runs-on: ubuntu-latest
    needs: [staging-build, staging-integration, staging-security, staging-docker]
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "## Staging Environment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.staging-build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration | ${{ needs.staging-integration.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security | ${{ needs.staging-security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker | ${{ needs.staging-docker.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Environment: **staging**" >> $GITHUB_STEP_SUMMARY
          echo "URL: ${{ env.STAGING_URL }}" >> $GITHUB_STEP_SUMMARY
