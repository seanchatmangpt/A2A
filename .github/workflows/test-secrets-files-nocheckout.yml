# =============================================================================
# Test Secrets and Vars from Files (No Checkout)
# =============================================================================
# Tests secrets and vars without checkout action to avoid git clone errors
# =============================================================================

name: Test Secrets and Vars No Checkout

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test-combined:
    name: Test Combined Secrets and Vars
    runs-on: ubuntu-latest
    steps:
      - name: Display combined configuration
        run: |
          echo "=== Combined Configuration ==="
          echo "Secrets available:"
          echo "  - CUSTOM_SECRET: $([[ -n "${{ secrets.CUSTOM_SECRET }}" ]] && echo 'SET' || echo 'NOT SET')"
          echo "  - DEPLOY_KEY: $([[ -n "${{ secrets.DEPLOY_KEY }}" ]] && echo 'SET' || echo 'NOT SET')"
          echo "  - API_KEY: $([[ -n "${{ secrets.API_KEY }}" ]] && echo 'SET' || echo 'NOT SET')"
          echo ""
          echo "Vars available:"
          echo "  - DEPLOY_ENV: $([[ -n "${{ vars.DEPLOY_ENV }}" ]] && echo 'SET' || echo 'NOT SET')"
          echo "  - LOG_LEVEL: $([[ -n "${{ vars.LOG_LEVEL }}" ]] && echo 'SET' || echo 'NOT SET')"
          echo "  - TEST_VAR: $([[ -n "${{ vars.TEST_VAR }}" ]] && echo 'SET' || echo 'NOT SET')"

      - name: Use secrets in environment
        env:
          DEPLOY_KEY_VALUE: ${{ secrets.DEPLOY_KEY }}
          API_KEY_VALUE: ${{ secrets.API_KEY }}
        run: |
          echo "Deploy key value in env: ${DEPLOY_KEY_VALUE}"
          echo "API key value in env: ${API_KEY_VALUE}"

      - name: Create test config file
        run: |
          cat > /tmp/test-config.json << EOF
          {
            "deploy_env": "${{ vars.DEPLOY_ENV }}",
            "log_level": "${{ vars.LOG_LEVEL }}",
            "test_var": "${{ vars.TEST_VAR }}",
            "has_deploy_key": true,
            "has_api_key": true
          }
          EOF
          echo "Config file created:"
          cat /tmp/test-config.json

      - name: Test secret in if condition
        if: ${{ secrets.DEPLOY_KEY == 'test-deploy-key' }}
        run: |
          echo "Secret condition matched! DEPLOY_KEY equals 'test-deploy-key'"

      - name: Test var in if condition
        if: ${{ vars.DEPLOY_ENV == 'testing' }}
        run: |
          echo "Var condition matched! DEPLOY_ENV equals 'testing'"

  test-in-container:
    name: Test Secrets in Container
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04
    steps:
      - name: Display secrets in container
        run: |
          echo "=== Secrets in Container ==="
          echo "CUSTOM_SECRET is set: $([[ -n "${{ secrets.CUSTOM_SECRET }}" ]] && echo 'YES' || echo 'NO')"
          echo "DEPLOY_KEY is set: $([[ -n "${{ secrets.DEPLOY_KEY }}" ]] && echo 'YES' || echo 'NO')"

      - name: Display vars in container
        run: |
          echo "=== Vars in Container ==="
          echo "DEPLOY_ENV: ${{ vars.DEPLOY_ENV }}"
          echo "LOG_LEVEL: ${{ vars.LOG_LEVEL }}"

  test-with-job-vars:
    name: Test with Job-Level Vars
    runs-on: ubuntu-latest
    env:
      JOB_LEVEL_VAR: from-job-env
    steps:
      - name: Display all variable levels
        run: |
          echo "=== Variable Hierarchy ==="
          echo "JOB_LEVEL_VAR: ${JOB_LEVEL_VAR}"
          echo "DEPLOY_ENV (from vars): ${{ vars.DEPLOY_ENV }}"
          echo "TEST_VAR (from vars): ${{ vars.TEST_VAR }}"
