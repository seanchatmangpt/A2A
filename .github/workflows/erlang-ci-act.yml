# =============================================================================
# Erlang CI Pipeline - Act Compatible for Local Testing
# =============================================================================
# Uses official Erlang Docker image
# =============================================================================

name: Erlang CI (Act - Local Testing)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # =============================================================================
  # Job: Build and Test
  # =============================================================================
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    container:
      image: erlang:28
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install rebar3 from source
        run: |
          apt-get update && apt-get install -y git curl
          curl -O -L https://s3.amazonaws.com/rebar3/rebar3
          chmod +x rebar3
          ./rebar3 version || echo "Pre-built binary failed, building from source..."
          git clone https://github.com/erlang/rebar3.git /tmp/rebar3
          cd /tmp/rebar3
          escript bootstrap
          cp rebar3 /usr/local/bin/rebar3
          /usr/local/bin/rebar3 version

      - name: Verify Erlang/OTP installation
        run: |
          echo "=== Erlang/OTP Version ==="
          erl -version
          echo ""
          echo "=== rebar3 Version ==="
          rebar3 version

      - name: Compile project
        run: |
          cd erlang/a2a_erl
          rebar3 compile

      - name: Run unit tests
        run: |
          cd erlang/a2a_erl
          mkdir -p results
          rebar3 ct --verbose false --logdir ./results --label erlang-ci

      - name: Show test results summary
        if: always()
        run: |
          cd erlang/a2a_erl
          if [ -d "results" ]; then
            echo "=== Test Results Summary ==="
            for log in results/*.log; do
              if [ -f "$log" ]; then
                echo "=== $(basename $log) ==="
                cat "$log"
              fi
            done
          else
            echo "No results directory found"
          fi

      - name: Generate coverage report
        if: success()
        run: |
          cd erlang/a2a_erl
          rebar3 cover -v
