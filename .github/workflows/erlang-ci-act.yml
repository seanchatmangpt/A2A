# =============================================================================
# Erlang CI Pipeline - Act Compatible for Local Testing
# =============================================================================
# Uses official Erlang Docker image
# =============================================================================

name: Erlang CI (Act - Local Testing)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # =============================================================================
  # Job: Build and Test
  # =============================================================================
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    container:
      image: erlang:27
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install rebar3
        run: |
          set -e
          apt-get update -qq && apt-get install -y -qq git curl ca-certificates
          curl -fsSL https://s3.amazonaws.com/rebar3/rebar3 -o /usr/local/bin/rebar3
          chmod +x /usr/local/bin/rebar3
          # Check rebar3 is available (version command may fail in non-interactive env)
          which rebar3 && ls -la /usr/local/bin/rebar3

      - name: Verify Erlang/OTP installation
        run: |
          echo "=== Erlang/OTP Version ==="
          erl -version
          echo ""
          echo "=== rebar3 available ==="
          which rebar3 && ls -la /usr/local/bin/rebar3

      - name: Compile project
        run: |
          cd erlang/a2a_erl
          rebar3 compile

      - name: Run xref analysis
        run: |
          cd erlang/a2a_erl
          rebar3 xref

      - name: Run dialyzer type check
        run: |
          cd erlang/a2a_erl
          rebar3 dialyzer

      - name: Run unit tests
        run: |
          cd erlang/a2a_erl
          mkdir -p results
          rebar3 ct --verbose false --logdir ./results --label erlang-ci

      - name: Show test results summary
        if: always()
        run: |
          cd erlang/a2a_erl
          if [ -d "results" ]; then
            echo "=== Test Results Summary ==="
            for log in results/*.log; do
              if [ -f "$log" ]; then
                echo "=== $(basename $log) ==="
                cat "$log"
              fi
            done
          else
            echo "No results directory found"
          fi

      - name: Generate coverage report
        if: success()
        run: |
          cd erlang/a2a_erl
          rebar3 cover -v
