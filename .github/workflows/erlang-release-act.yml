name: Erlang Release Tarball (Act - Local Testing)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-tarball:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/catthehacker/ubuntu:act-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Erlang/OTP from Team RabbitMQ repository
        run: |
          apt-get update
          apt-get install -y curl gnupg apt-transport-https

          # Team RabbitMQ's signing key
          curl -1sLf "https://keys.openpgp.org/vks/v1/by-fingerprint/0A9AF2115F4687BD29803A206B73A36E6026DFCA" | gpg --dearmor > /usr/share/keyrings/com.rabbitmq.team.gpg

          # Add apt repository for Erlang (Ubuntu Jammy)
          tee /etc/apt/sources.list.d/rabbitmq.list <<EOF
          deb [arch=amd64 signed-by=/usr/share/keyrings/com.rabbitmq.team.gpg] https://deb1.rabbitmq.com/rabbitmq-erlang/ubuntu/jammy jammy main
          deb [arch=amd64 signed-by=/usr/share/keyrings/com.rabbitmq.team.gpg] https://deb2.rabbitmq.com/rabbitmq-erlang/ubuntu/jammy jammy main
          EOF

          apt-get update
          apt-get install -y erlang-base \
            erlang-asn1 erlang-crypto erlang-eldap erlang-ftp erlang-inets \
            erlang-mnesia erlang-os-mon erlang-parsetools erlang-public-key \
            erlang-runtime-tools erlang-snmp erlang-ssl \
            erlang-syntax-tools erlang-tftp erlang-tools erlang-xmerl

      - name: Install rebar3
        run: |
          curl -Lo /usr/local/bin/rebar3 https://s3.amazonaws.com/rebar3/rebar3
          chmod +x /usr/local/bin/rebar3

      - name: Verify installations
        run: |
          erl -version
          rebar3 version

      - name: Build release
        run: |
          cd erlang/a2a_erl && rebar3 release

      - name: Verify release output
        run: |
          cd erlang/a2a_erl
          RELNAME=a2a_erl
          if [ -d "_build/default/rel/$RELNAME" ]; then
            echo "Release directory exists: _build/default/rel/$RELNAME"
            ls -la _build/default/rel/$RELNAME/
          else
            echo "ERROR: Release directory not found"
            ls -la _build/default/rel/ || echo "No rel directory at all"
            exit 1
          fi

      - name: Create tarball
        run: |
          cd erlang/a2a_erl && rebar3 tar

      - name: Verify tarball
        run: |
          cd erlang/a2a_erl
          RELNAME=a2a_erl
          TARBALL=$(ls _build/default/rel/$RELNAME/*.tar.gz 2>/dev/null || echo "")
          if [ -n "$TARBALL" ]; then
            echo "Tarball created successfully: $TARBALL"
            ls -la "$TARBALL"
            tar -tzf "$TARBALL" | head -20
            echo "Total files in tarball: $(tar -tzf "$TARBALL" | wc -l)"
          else
            echo "ERROR: Tarball not found"
            exit 1
          fi
