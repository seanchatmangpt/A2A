# =============================================================================
# Test Secrets and Vars from Files
# =============================================================================
# Tests that secrets and variables loaded from .secrets and .vars files
# are properly passed to workflows.
# =============================================================================

name: Test Secrets and Vars from Files

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test-secrets-from-files:
    name: Test Secrets from .secrets File
    runs-on: ubuntu-latest
    steps:
      - name: Display all secrets
        run: |
          echo "=== Secrets from .secrets file ==="
          echo "GITHUB_TOKEN is set: $([[ -n "${{ secrets.GITHUB_TOKEN }}" ]] && echo 'YES' || echo 'NO')"
          echo "CUSTOM_SECRET is set: $([[ -n "${{ secrets.CUSTOM_SECRET }}" ]] && echo 'YES' || echo 'NO')"
          echo "SECRET_FOR_TESTS is set: $([[ -n "${{ secrets.SECRET_FOR_TESTS }}" ]] && echo 'YES' || echo 'NO')"
          echo "DEPLOY_KEY is set: $([[ -n "${{ secrets.DEPLOY_KEY }}" ]] && echo 'YES' || echo 'NO')"
          echo "API_KEY is set: $([[ -n "${{ secrets.API_KEY }}" ]] && echo 'YES' || echo 'NO')"

      - name: Use secret in command
        run: |
          echo "Testing secret usage..."
          echo "Deploy key length: ${#SECRET}"
          if [ "${{ secrets.DEPLOY_KEY }}" = "test-deploy-key" ]; then
            echo "DEPLOY_KEY has expected value (for testing)"
          fi

  test-vars-from-files:
    name: Test Vars from .vars File
    runs-on: ubuntu-latest
    steps:
      - name: Display all vars
        run: |
          echo "=== Vars from .vars file ==="
          echo "TEST_VAR is set: $([[ -n "${{ vars.TEST_VAR }}" ]] && echo 'YES' || echo 'NO')"
          echo "ANOTHER_VAR is set: $([[ -n "${{ vars.ANOTHER_VAR }}" ]] && echo 'YES' || echo 'NO')"
          echo "DEPLOY_ENV is set: $([[ -n "${{ vars.DEPLOY_ENV }}" ]] && echo 'YES' || echo 'NO')"
          echo "LOG_LEVEL is set: $([[ -n "${{ vars.LOG_LEVEL }}" ]] && echo 'YES' || echo 'NO')"

      - name: Use var in command
        run: |
          echo "Testing var usage..."
          echo "Deploy environment: ${{ vars.DEPLOY_ENV }}"
          echo "Log level: ${{ vars.LOG_LEVEL }}"

  test-combined:
    name: Test Combined Secrets and Vars
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Display combined configuration
        run: |
          echo "=== Combined Configuration ==="
          echo "Secrets available:"
          echo "  - CUSTOM_SECRET: $([[ -n "${{ secrets.CUSTOM_SECRET }}" ]] && echo 'SET' || echo 'NOT SET')"
          echo "  - DEPLOY_KEY: $([[ -n "${{ secrets.DEPLOY_KEY }}" ]] && echo 'SET' || echo 'NOT SET')"
          echo ""
          echo "Vars available:"
          echo "  - DEPLOY_ENV: $([[ -n "${{ vars.DEPLOY_ENV }}" ]] && echo 'SET' || echo 'NOT SET')"
          echo "  - LOG_LEVEL: $([[ -n "${{ vars.LOG_LEVEL }}" ]] && echo 'SET' || echo 'NOT SET')"

      - name: Create test config file
        run: |
          cat > /tmp/test-config.json << EOF
          {
            "deploy_env": "${{ vars.DEPLOY_ENV }}",
            "log_level": "${{ vars.LOG_LEVEL }}",
            "has_deploy_key": $([[ -n "${{ secrets.DEPLOY_KEY }}" ]] && echo 'true' || echo 'false'),
            "has_api_key": $([[ -n "${{ secrets.API_KEY }}" ]] && echo 'true' || echo 'false')
          }
          EOF
          cat /tmp/test-config.json
