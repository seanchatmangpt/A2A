# =============================================================================
# Test Erlang CI with Secrets and Environment Variables
# =============================================================================
# Tests that the actual Erlang CI workflow can access secrets and env vars
# =============================================================================

name: Test Erlang CI with Secrets

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  OTP_VERSION: "28"
  REBAR3_VERSION: "3.24.0"
  GLOBAL_ENV_VAR: "from-global-env"

jobs:
  compile-with-secrets:
    name: Compile with Secrets Access
    runs-on: ubuntu-latest
    steps:
      - name: Display environment variables
        run: |
          echo "=== Environment Variables ==="
          echo "OTP_VERSION: ${OTP_VERSION}"
          echo "REBAR3_VERSION: ${REBAR3_VERSION}"
          echo "GLOBAL_ENV_VAR: ${GLOBAL_ENV_VAR}"

      - name: Display secrets availability
        run: |
          echo "=== Secrets Availability ==="
          echo "GITHUB_TOKEN: $([[ -n "${{ secrets.GITHUB_TOKEN }}" ]] && echo 'SET' || echo 'NOT SET')"
          echo "CUSTOM_SECRET: $([[ -n "${{ secrets.CUSTOM_SECRET }}" ]] && echo 'SET' || echo 'NOT SET')"
          echo "DEPLOY_KEY: $([[ -n "${{ secrets.DEPLOY_KEY }}" ]] && echo 'SET' || echo 'NOT SET')"
          echo "API_KEY: $([[ -n "${{ secrets.API_KEY }}" ]] && echo 'SET' || echo 'NOT SET')"

      - name: Display vars availability
        run: |
          echo "=== Vars Availability ==="
          echo "DEPLOY_ENV: ${{ vars.DEPLOY_ENV }}"
          echo "LOG_LEVEL: ${{ vars.LOG_LEVEL }}"
          echo "TEST_VAR: ${{ vars.TEST_VAR }}"

      - name: Test with all configuration
        env:
          BUILD_ENV: production
        run: |
          echo "=== Full Configuration Test ==="
          echo "Build environment: ${BUILD_ENV}"
          echo "Deploy env from vars: ${{ vars.DEPLOY_ENV }}"
          echo "OTP version from workflow env: ${OTP_VERSION}"
          echo "All configuration sources accessible!"

  test-in-container:
    name: Test in Container
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/catthehacker/ubuntu:act-22.04
    steps:
      - name: Display container info
        run: |
          echo "=== Container Environment ==="
          echo "OS: $(cat /etc/os-release | grep PRETTY_NAME)"
          echo "Shell: $SHELL"
          echo ""

      - name: Display secrets in container
        run: |
          echo "=== Secrets in Container ==="
          echo "CUSTOM_SECRET is set: $([[ -n "${{ secrets.CUSTOM_SECRET }}" ]] && echo 'YES' || echo 'NO')"
          echo "DEPLOY_KEY is set: $([[ -n "${{ secrets.DEPLOY_KEY }}" ]] && echo 'YES' || echo 'NO')"

      - name: Display vars in container
        run: |
          echo "=== Vars in Container ==="
          echo "DEPLOY_ENV: ${{ vars.DEPLOY_ENV }}"
          echo "LOG_LEVEL: ${{ vars.LOG_LEVEL }}"

      - name: Use configuration in script
        run: |
          echo "#!/bin/sh" > /tmp/test-config.sh
          echo "echo \"Deploy Environment: ${{ vars.DEPLOY_ENV }}\"" >> /tmp/test-config.sh
          echo "echo \"Log Level: ${{ vars.LOG_LEVEL }}\"" >> /tmp/test-config.sh
          echo "echo \"OTP Version: ${OTP_VERSION}\"" >> /tmp/test-config.sh
          chmod +x /tmp/test-config.sh
          /tmp/test-config.sh
