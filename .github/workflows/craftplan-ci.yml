name: Craftplan Integration CI

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'craftplan/**'
      - '.github/workflows/craftplan-ci.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'craftplan/**'
      - '.github/workflows/craftplan-ci.yml'
  workflow_dispatch:

env:
  OTP_VERSION: '27'
  REBAR3_VERSION: '3.23.0'

jobs:
  # =============================================================================
  # Build MCP Server
  # =============================================================================
  build-mcp:
    name: Build MCP Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Erlang/OTP
        uses: erlang-solutions/beam-action@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          rebar3-version: ${{ env.REBAR3_VERSION }}

      - name: Cache Rebar3 dependencies
        uses: actions/cache@v4
        with:
          path: |
            craftplan/mcp-server/_build
            craftplan/mcp-server/rebar3.crashdump
          key: ${{ runner.os }}-mcp-${{ hashFiles('craftplan/mcp-server/rebar.config') }}
          restore-keys: |
            ${{ runner.os }}-mcp-

      - name: Compile MCP Server
        working-directory: craftplan/mcp-server
        run: |
          rebar3 compile
          rebar3 dialyzer

      - name: Run MCP Server Tests
        working-directory: craftplan/mcp-server
        run: |
          rebar3 ct --cover
          rebar3 cover
        continue-on-error: true

      - name: Create MCP Server Release
        working-directory: craftplan/mcp-server
        run: rebar3 release -s craftplan_mcp

      - name: Upload MCP Server Release
        uses: actions/upload-artifact@v4
        with:
          name: craftplan-mcp-release
          path: craftplan/mcp-server/_build/default/rel/craftplan_mcp/
          retention-days: 7

  # =============================================================================
  # Build A2A Agent
  # =============================================================================
  build-a2a:
    name: Build A2A Agent
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Erlang/OTP
        uses: erlang-solutions/beam-action@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          rebar3-version: ${{ env.REBAR3_VERSION }}

      - name: Cache Rebar3 dependencies
        uses: actions/cache@v4
        with:
          path: |
            craftplan/a2a-agent/_build
            craftplan/a2a-agent/rebar3.crashdump
          key: ${{ runner.os }}-a2a-${{ hashFiles('craftplan/a2a-agent/rebar.config') }}
          restore-keys: |
            ${{ runner.os }}-a2a-

      - name: Compile A2A Agent
        working-directory: craftplan/a2a-agent
        run: |
          rebar3 compile
          rebar3 dialyzer

      - name: Run A2A Agent Tests
        working-directory: craftplan/a2a-agent
        run: |
          rebar3 ct --cover
          rebar3 cover
        continue-on-error: true

      - name: Create A2A Agent Release
        working-directory: craftplan/a2a-agent
        run: rebar3 release -s craftplan_a2a

      - name: Upload A2A Agent Release
        uses: actions/upload-artifact@v4
        with:
          name: craftplan-a2a-release
          path: craftplan/a2a-agent/_build/default/rel/craftplan_a2a/
          retention-days: 7

  # =============================================================================
  # Build Docker Images
  # =============================================================================
  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [build-mcp, build-a2a]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    strategy:
      matrix:
        component:
          - name: mcp-server
            context: craftplan/mcp-server
            image: craftplan-mcp-server
          - name: a2a-agent
            context: craftplan/a2a-agent
            image: craftplan-a2a-agent

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.component.context }}
          file: ${{ matrix.component.context }}/Dockerfile
          platforms: linux/amd64
          tags: |
            ${{ matrix.component.image }}:latest
            ${{ matrix.component.image }}:${{ github.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker image
        run: |
          docker inspect ${{ matrix.component.image }}:latest
          docker run --rm ${{ matrix.component.image }}:latest --version || true

      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.component.context }}
          file: ${{ matrix.component.context }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ matrix.component.image }}:latest
            ${{ matrix.component.image }}:${{ github.sha }}

  # =============================================================================
  # Integration Tests
  # =============================================================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [build-docker]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Erlang/OTP
        uses: erlang-solutions/beam-action@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          rebar3-version: ${{ env.REBAR3_VERSION }}

      - name: Start Docker Compose stack
        working-directory: craftplan
        run: |
          docker compose -f docker-compose.local.yml up -d
          sleep 30

      - name: Check MCP Server health
        run: |
          curl --retry 10 --retry-delay 5 --retry-connrefused \
            http://localhost:8090/health || exit 1

      - name: Check A2A Agent health
        run: |
          curl --retry 10 --retry-delay 5 --retry-connrefused \
            http://localhost:8080/health || exit 1

      - name: Run integration tests with test-all.sh
        working-directory: craftplan
        run: |
          chmod +x scripts/test-all.sh
          ./scripts/test-all.sh --integration --verbose

      - name: Test MCP protocol
        run: |
          curl -s -X POST http://localhost:8090/mcp \
            -H "Content-Type: application/json" \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"test","version":"1.0"}}}' | \
            jq . || echo "MCP protocol test completed"

      - name: Docker Compose logs
        if: always()
        working-directory: craftplan
        run: docker compose -f docker-compose.local.yml logs

      - name: Stop Docker Compose stack
        if: always()
        working-directory: craftplan
        run: docker compose -f docker-compose.local.yml down -v

  # =============================================================================
  # Code Quality
  # =============================================================================
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Erlang/OTP
        uses: erlang-solutions/beam-action@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          rebar3-version: ${{ env.REBAR3_VERSION }}

      - name: XREF checks - MCP Server
        working-directory: craftplan/mcp-server
        run: rebar3 xref
        continue-on-error: true

      - name: XREF checks - A2A Agent
        working-directory: craftplan/a2a-agent
        run: rebar3 xref
        continue-on-error: true

      - name: Format check - MCP Server
        working-directory: craftplan/mcp-server
        run: rebar3 format --verify
        continue-on-error: true

      - name: Format check - A2A Agent
        working-directory: craftplan/a2a-agent
        run: rebar3 format --verify
        continue-on-error: true

  # =============================================================================
  # Security Scanning
  # =============================================================================
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'craftplan/'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  # =============================================================================
  # Release (on main branch only)
  # =============================================================================
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-mcp, build-a2a, integration-tests, code-quality]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download MCP Server release
        uses: actions/download-artifact@v4
        with:
          name: craftplan-mcp-release
          path: releases/craftplan-mcp

      - name: Download A2A Agent release
        uses: actions/download-artifact@v4
        with:
          name: craftplan-a2a-release
          path: releases/craftplan-a2a

      - name: Create release archives
        run: |
          cd releases
          tar -czf craftplan-mcp-${{ github.sha }}.tar.gz craftplan-mcp/
          tar -czf craftplan-a2a-${{ github.sha }}.tar.gz craftplan-a2a/
          cd ..

      - name: Generate release notes
        id: release_notes
        run: |
          cat > release_notes.md << 'EOF'
          ## Craftplan Integration Release ${{ github.sha }}

          ### What's Included

          - **MCP Server**: Erlang/OTP-based MCP server with Craftplan ERP integration
          - **A2A Agent**: Agent-to-Agent protocol implementation for Craftplan

          ### Installation

          #### MCP Server
          ```bash
          tar -xzf craftplan-mcp-${{ github.sha }}.tar.gz
          cd craftplan-mcp
          ./bin/craftplan_mcp foreground
          ```

          #### A2A Agent
          ```bash
          tar -xzf craftplan-a2a-${{ github.sha }}.tar.gz
          cd craftplan-a2a
          ./bin/craftplan_a2a foreground
          ```

          ### Docker Images

          ```bash
          docker pull craftplan/craftplan-mcp-server:latest
          docker pull craftplan/craftplan-a2a-agent:latest
          ```

          ### Quick Start with Docker Compose

          ```bash
          cd craftplan
          docker compose -f docker-compose.stack.yml up -d
          ```

          ### Documentation

          See [README.md](craftplan/README.md) for full documentation.

          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: Craftplan Integration v${{ github.run_number }}
          body_path: release_notes.md
          files: |
            releases/craftplan-mcp-${{ github.sha }}.tar.gz
            releases/craftplan-a2a-${{ github.sha }}.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
