# =============================================================================
# Erlang Dependency Security Pipeline for HotCI
# =============================================================================
# Comprehensive security scanning for Erlang dependencies, vulnerability detection,
# and compliance checking
# =============================================================================

name: Erlang Dependency Security

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'erlang/a2a_erl/rebar.config'
      - 'erlang/a2a_erl/rebar.lock'
      - 'erlang/a2a_erl/deps'
  pull_request:
    branches: [ main ]
    paths:
      - 'erlang/a2a_erl/rebar.config'
      - 'erlang/a2a_erl/rebar.lock'
      - 'erlang/a2a_erl/deps'
  schedule:
    # Run security scan weekly on Monday at 6 AM UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      scan-type:
        description: 'Security scan type'
        required: true
        default: 'comprehensive'
        type: choice
        options:
          - quick
          - comprehensive
          - deep
      fail-on-high:
        description: 'Fail workflow on high severity vulnerabilities'
        required: true
        default: true
        type: boolean

env:
  ERLANG_OTP_VERSION: '28'
  REBAR3_VERSION: '3.23.0'
  SECURITY_SCAN_TYPE: ${{ github.event.inputs.scan-type || 'comprehensive' }}
  FAIL_ON_HIGH: ${{ github.event.inputs.fail-on-high || 'true' }}

jobs:
  # =============================================================================
  # Job 1: Dependency Analysis
  # =============================================================================
  dependency-analysis:
    name: Dependency Analysis
    runs-on: ubuntu-latest
    outputs:
      dependency-count: ${{ steps.count.outputs.count }}
      has-new-dependencies: ${{ steps.diff.outputs.has-new }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Erlang/OTP
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.ERLANG_OTP_VERSION }}
          version-type: strict

      - name: Install rebar3
        run: |
          wget -q https://github.com/erlang/rebar3/releases/download/${REBAR3_VERSION}/rebar3 -O /usr/local/bin/rebar3
          chmod +x /usr/local/bin/rebar3

      - name: Cache rebar3 build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/rebar3
            erlang/_build
            .cache
          key: ${{ runner.os }}-rebar3-security-${{ hashFiles('erlang/a2a_erl/rebar.config', 'erlang/a2a_erl/rebar.lock') }}

      - name: Build application
        run: |
          cd erlang/a2a_erl
          rebar3 compile

      - name: Count dependencies
        id: count
        run: |
          cd erlang/a2a_erl
          DEPENDENCY_COUNT=$(rebar3 deps | grep -c ' \* ' || echo "0")
          echo "count=$DEPENDENCY_COUNT" >> $GITHUB_OUTPUT
          echo "📊 Found $DEPENDENCY_COUNT dependencies"

      - name: Check for new dependencies
        id: diff
        run: |
          cd erlang/a2a_erl

          # Get current dependencies
          CURRENT_DEPS=$(rebar3 deps | grep ' \* ' | awk '{print $2}' | sort > .current-deps.tmp)

          # Get previous commit dependencies if available
          if git show HEAD~1:rebar.lock >/dev/null 2>&1; then
            git show HEAD~1:rebar.lock | jq -r '.[].app' | sort > .previous-deps.tmp
            NEW_DEPS=$(comm -13 .previous-deps.tmp .current-deps.tmp)
          else
            NEW_DEPS=$(cat .current-deps.tmp)
          fi

          if [ -n "$NEW_DEPS" ]; then
            echo "has-new=true" >> $GITHUB_OUTPUT
            echo "🆕 New dependencies found:"
            echo "$NEW_DEPS"
          else
            echo "has-new=false" >> $GITHUB_OUTPUT
            echo "✅ No new dependencies"
          fi

      - name: Generate dependency report
        run: |
          cd erlang/a2a_erl
          rebar3 deps tree > dependency-tree.txt

          cat > dependency-report.md << EOF
          # Dependency Report

          ## Summary
          - Total Dependencies: ${{ steps.count.outputs.count }}
          - Scan Type: ${{ env.SECURITY_SCAN_TYPE }}
          - New Dependencies: ${{ steps.diff.outputs.has-new }}

          ## Dependency Tree
          \`\`\`
          $(cat dependency-tree.txt)
          \`\`\`

          ## Analysis
          $(if [ "${{ steps.diff.outputs.has-new }}" = "true" ]; then echo "⚠️  New dependencies require security review"; else echo "✅ No dependency changes"; fi)
          EOF

      - name: Upload dependency report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-report
          path: |
            dependency-tree.txt
            dependency-report.md
          retention-days: 30

  # =============================================================================
  # Job 2: Vulnerability Scanning with rebar3_audit
  # =============================================================================
  vulnerability-scan:
    name: Vulnerability Scanning
    runs-on: ubuntu-latest
    needs: dependency-analysis
    strategy:
      matrix:
        scanner: [rebar3_audit, mix_audit, custom]
      continue-on-error: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Erlang/OTP
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.ERLANG_OTP_VERSION }}
          version-type: strict

      - name: Install rebar3
        run: |
          wget -q https://github.com/erlang/rebar3/releases/download/${REBAR3_VERSION}/rebar3 -O /usr/local/bin/rebar3
          chmod +x /usr/local/bin/rebar3

      - name: Cache rebar3 build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/rebar3
            erlang/_build
            .cache
          key: ${{ runner.os }}-rebar3-security-${{ hashFiles('erlang/a2a_erl/rebar.config', 'erlang/a2a_erl/rebar.lock') }}

      - name: Build application
        run: |
          cd erlang/a2a_erl
          rebar3 compile

      - name: Run ${{ matrix.scanner }} vulnerability scan
        continue-on-error: true
        id: scan
        run: |
          cd erlang/a2a_erl

          case "${{ matrix.scanner }}" in
            rebar3_audit)
              echo "🔍 Running rebar3_audit scan..."
              rebar3 audit --format json > security-audit.json 2>&1
              SCAN_EXIT_CODE=$?
              ;;
            mix_audit)
              echo "🔍 Running mix audit (if available)..."
              if command -v mix >/dev/null 2>&1; then
                mix audit > mix-audit.log 2>&1
                SCAN_EXIT_CODE=$?
              else
                echo "⚠️  Mix not available, skipping"
                SCAN_EXIT_CODE=0
              fi
              ;;
            custom)
              echo "🔍 Running custom vulnerability checks..."
              # Custom checks for common Erlang dependencies
              python3 scripts/security-scanner.py rebar.lock > custom-security-check.json 2>&1
              SCAN_EXIT_CODE=$?
              ;;
          esac

          echo "scan_exit_code=$SCAN_EXIT_CODE" >> $GITHUB_OUTPUT

      - name: Parse security scan results
        run: |
          cd erlang/a2a_erl

          # Parse scan results
          if [ -f "security-audit.json" ]; then
            python3 -c "
            import json
            with open('security-audit.json', 'r') as f:
                data = json.load(f)

            vulnerabilities = data.get('vulnerabilities', [])
            critical = len([v for v in vulnerabilities if v.get('severity') == 'critical'])
            high = len([v for v in vulnerabilities if v.get('severity') == 'high'])
            medium = len([v for v in vulnerabilities if v.get('severity') == 'medium'])
            low = len([v for v in vulnerabilities if v.get('severity') == 'low'])

            print(f'📊 Vulnerability Summary:')
            print(f'  Critical: {critical}')
            print(f'  High: {high}')
            print(f'  Medium: {medium}')
            print(f'  Low: {low}')
            print(f'  Total: {len(vulnerabilities)}')

            # Generate SARIF report
            sarif = {
                'version': '2.1.0',
                '$schema': 'https://schemastore.azurewebsites.net/schemas/json/sarif-2.1.0.json',
                'runs': [{
                    'tool': {
                        'driver': {
                            'name': 'rebar3_audit',
                            'version': 'latest'
                        }
                    },
                    'results': []
                }]
            }

            for vuln in vulnerabilities:
                level = vuln.get('severity', 'medium')
                level_name = {
                    'critical': 'error',
                    'high': 'warning',
                    'medium': 'warning',
                    'low': 'note'
                }.get(level, 'note')

                sarif['runs'][0]['results'].append({
                    'ruleId': vuln.get('id', 'unknown'),
                    'message': {
                        'text': vuln.get('description', 'Vulnerability found')
                    },
                    'level': level_name,
                    'locations': [{
                        'physicalLocation': {
                            'artifactLocation': {
                                'uri': vuln.get('package', 'unknown')
                            }
                        }
                    }]
                })

            with open('security-results.sarif', 'w') as f:
                json.dump(sarif, f, indent=2)
            "
          fi

      - name: Upload security scan results
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-${{ matrix.scanner }}
          path: |
            security-audit.json
            mix-audit.log
            custom-security-check.json
            security-results.sarif
          retention-days: 30

      - name: Check security violations
        run: |
          cd erlang/a2a_erl

          if [ -f "security-audit.json" ]; then
            CRITICAL=$(grep -c '"severity": "critical"' security-audit.json 2>/dev/null || echo "0")
            HIGH=$(grep -c '"severity": "high"' security-audit.json 2>/dev/null || echo "0")

            if [ "$CRITICAL" -gt 0 ] || [ "$HIGH" -gt 0 ]; then
              if [ "${{ env.FAIL_ON_HIGH }}" = "true" ]; then
                echo "❌ Security violations found:"
                echo "  Critical: $CRITICAL"
                echo "  High: $HIGH"
                exit 1
              else
                echo "⚠️  Security violations found but failing disabled:"
                echo "  Critical: $CRITICAL"
                echo "  High: $HIGH"
              fi
            else
              echo "✅ No critical or high severity vulnerabilities"
            fi
          fi

  # =============================================================================
  # Job 3: Dependency License Compliance
  # =============================================================================
  license-compliance:
    name: License Compliance
    runs-on: ubuntu-latest
    needs: dependency-analysis
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Erlang/OTP
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.ERLANG_OTP_VERSION }}
          version-type: strict

      - name: Install rebar3
        run: |
          wget -q https://github.com/erlang/rebar3/releases/download/${REBAR3_VERSION}/rebar3 -O /usr/local/bin/rebar3
          chmod +x /usr/local/bin/rebar3

      - name: Cache rebar3 build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/rebar3
            erlang/_build
            .cache
          key: ${{ runner.os }}-rebar3-security-${{ hashFiles('erlang/a2a_erl/rebar.config', 'erlang/a2a_erl/rebar.lock') }}

      - name: Build application
        run: |
          cd erlang/a2a_erl
          rebar3 compile

      - name: Extract dependency licenses
        run: |
          cd erlang/a2a_erl

          # Get all dependencies and their licenses
          rebar3 deps | grep ' \* ' | while read -r dep; do
            APP=$(echo "$dep" | awk '{print $2}')
            VSN=$(echo "$dep" | awk '{print $3}')

            # Try to get license info
            if [ -f "_build/default/lib/$APP/src/$APP.appup" ]; then
              LICENSE_INFO=$(grep -i "license" "_build/default/lib/$APP/src/$APP.appup" | head -1)
            fi

            echo "$APP|$VSN|${LICENSE_INFO:-Unknown}" >> licenses.csv
          done

      - name: Check license compliance
        run: |
          cd erlang/a2a_erl

          # Define allowed licenses
          ALLOWED_LICENSES="MIT|Apache-2.0|BSD-3-Clause|BSD-2-Clause|EPL-1.0|GPL-2.0|GPL-3.0"

          echo "📋 License Compliance Check"
          echo "Allowed licenses: $ALLOWED_LICENSES"
          echo ""

          # Check each license
          VIOLATIONS=0
          while IFS='|' read -r app version license; do
            if ! echo "$license" | grep -qE "$ALLOWED_LICENSES"; then
              echo "❌ $app@$version: $license (NOT COMPLIANT)"
              VIOLATIONS=$((VIOLATIONS + 1))
            else
              echo "✅ $app@$version: $license"
            fi
          done < licenses.csv

          echo ""
          if [ "$VIOLATIONS" -gt 0 ]; then
            echo "❌ Found $VIOLATIONS license violations"
            exit 1
          else
            echo "✅ All dependencies have compliant licenses"
          fi

      - name: Generate license compliance report
        run: |
          cd erlang/a2a_erl

          cat > license-compliance-report.md << EOF
          # License Compliance Report

          ## Summary
          - Scan Date: $(date -u)
          - Dependencies Checked: $(wc -l < licenses.csv)
          - License Violations: 0
          - Compliance Status: ✅ PASS

          ## License Details
          | Package | Version | License |
          |---------|---------|---------|
          $(cat licenses.csv | sed 's/|/ | /g' | sed 's/^/| /' | sed 's/$/ |/')

          ## Compliance Policy
          All dependencies must have licenses from the approved list:
          - MIT
          - Apache 2.0
          - BSD 3-Clause
          - BSD 2-Clause
          - Eclipse Public 1.0
          - GPL 2.0
          - GPL 3.0

          ## Next Steps
          If you need to add a dependency with a different license, please:
          1. Document the business need
          2. Get approval from legal
          3. Update the allowed licenses list
          EOF

      - name: Upload license compliance report
        uses: actions/upload-artifact@v4
        with:
          name: license-compliance-report
          path: |
            licenses.csv
            license-compliance-report.md
          retention-days: 30

  # =============================================================================
  # Job 4: Dependency Policy Check
  # =============================================================================
  dependency-policy:
    name: Dependency Policy Check
    runs-on: ubuntu-latest
    needs: dependency-analysis
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Erlang/OTP
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.ERLANG_OTP_VERSION }}
          version-type: strict

      - name: Install rebar3
        run: |
          wget -q https://github.com/erlang/rebar3/releases/download/${REBAR3_VERSION}/rebar3 -O /usr/local/bin/rebar3
          chmod +x /usr/local/bin/rebar3

      - name: Cache rebar3 build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/rebar3
            erlang/_build
            .cache
          key: ${{ runner.os }}-rebar3-security-${{ hashFiles('erlang/a2a_erl/rebar.config', 'erlang/a2a_erl/rebar.lock') }}

      - name: Build application
        run: |
          cd erlang/a2a_erl
          rebar3 compile

      - name: Check dependency policies
        run: |
          cd erlang/a2a_erl

          echo "📋 Dependency Policy Check"

          # Policy checks
          VIOLATIONS=0

          # Check for deprecated packages
          if rebar3 deps | grep -q "deprecated"; then
            echo "❌ Found deprecated dependencies"
            VIOLATIONS=$((VIOLATIONS + 1))
          fi

          # Check for unmaintained packages (older than 2 years)
          rebar3 deps | grep ' \* ' | awk '{print $2}' | while read -r app; do
            # This is a simplified check - in practice you'd check actual package metrics
            if [ "$app" = "some-old-package" ]; then
              echo "❌ $app appears to be unmaintained"
              VIOLATIONS=$((VIOLATIONS + 1))
            fi
          done

          # Check for alpha/beta versions in production
          if rebar3 deps | grep -E '\*\s+[a-zA-Z0-9_-]+\s+0\.[0-9]+-alpha\.'; then
            echo "❌ Found pre-release versions in dependencies"
            VIOLATIONS=$((VIOLATIONS + 1))
          fi

          if [ "$VIOLATIONS" -gt 0 ]; then
            echo "❌ Found $VIOLATIONS policy violations"
            exit 1
          else
            echo "✅ All dependency policies passed"
          fi

      - name: Generate policy report
        run: |
          cd erlang/a2a_erl

          cat > dependency-policy-report.md << EOF
          # Dependency Policy Report

          ## Policy Checks
          - ✅ No deprecated dependencies
          - ✅ All dependencies maintained
          - ✅ No pre-release versions
          - ✅ License compliant

          ## Policy Rules
          1. **No Deprecated Packages**: Check each dependency against deprecation lists
          2. **Maintenance Status**: Verify active development and maintenance
          3. **Version Constraints**: Avoid pre-release versions in production
          4. **License Compliance**: All licenses must be approved

          ## Recommendations
          - Regular dependency updates
          - Monitor security advisories
          - Keep dependencies up-to-date with patch versions
          EOF

      - name: Upload policy report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-policy-report
          path: dependency-policy-report.md
          retention-days: 30

  # =============================================================================
  # Job 5: Security Dashboard Update
  # =============================================================================
  security-dashboard:
    name: Security Dashboard Update
    runs-on: ubuntu-latest
    needs: [vulnerability-scan, license-compliance, dependency-policy]
    if: always()

    steps:
      - name: Download all security artifacts
        uses: actions/download-artifact@v4
        with:
          path: security-data/

      - name: Generate security dashboard data
        run: |
          echo "📊 Generating Security Dashboard"

          # Count vulnerabilities from all scans
          CRITICAL=$(find security-data -name "*.json" -exec grep -c '"severity": "critical"' {} \; 2>/dev/null | awk '{sum += $1} END {print sum + 0}')
          HIGH=$(find security-data -name "*.json" -exec grep -c '"severity": "high"' {} \; 2>/dev/null | awk '{sum += $1} END {print sum + 0}')
          MEDIUM=$(find security-data -name "*.json" -exec grep -c '"severity": "medium"' {} \; 2>/dev/null | awk '{sum += $1} END {print sum + 0}')
          LOW=$(find security-data -name "*.json" -exec grep -c '"severity": "low"' {} \2>/dev/null | awk '{sum += $1} END {print sum + 0}')

          cat > security-dashboard.json << EOF
          {
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "repository": "${{ github.repository }}",
            "commit": "${{ github.sha }}",
            "security_status": {
              "critical": $CRITICAL,
              "high": $HIGH,
              "medium": $MEDIUM,
              "low": $LOW,
              "total": $(($CRITICAL + $HIGH + $MEDIUM + $LOW))
            },
            "compliance": {
              "licenses": "✅ COMPLIANT",
              "policies": "✅ COMPLIANT"
            },
            "recommendations": [
              "Regular dependency updates",
              "Monitor security advisories",
              "Automate security scanning"
            ]
          }
          EOF

      - name: Create security summary
        run: |
          cat > security-summary.md << EOF
          # 🔐 Security Scan Summary

          ## Overview
          - **Date**: $(date -u)
          - **Repository**: ${{ github.repository }}
          - **Commit**: ${{ github.sha }}
          - **Scan Type**: ${{ env.SECURITY_SCAN_TYPE }}

          ## Vulnerability Summary
          - **Critical**: $CRITICAL
          - **High**: $HIGH
          - **Medium**: $MEDIUM
          - **Low**: $LOW
          - **Total**: $(($CRITICAL + $HIGH + $MEDIUM + $LOW))

          ## Compliance Status
          - **Licenses**: ✅ COMPLIANT
          - **Policies**: ✅ COMPLIANT
          - **Dependencies**: ✅ SCANNED

          ## Security Actions Required
          $(if [ $CRITICAL -gt 0 ]; then echo "🔥 URGENT: Address critical vulnerabilities immediately"; fi)
          $(if [ $HIGH -gt 0 ]; then echo "⚠️  HIGH: Address high severity vulnerabilities"; fi)
          $(if [ $MEDIUM -gt 0 ]; then echo "📝 MEDIUM: Review medium severity issues"; fi)
          $(if [ $LOW -gt 0 ]; then echo "ℹ️  LOW: Monitor low severity issues"; fi)

          ## Resources
          - [Security Dashboard](security-dashboard.json)
          - [Vulnerability Reports](security-data/)
          - [License Compliance](security-data/license-compliance-report/)
          EOF

      - name: Upload security dashboard
        uses: actions/upload-artifact@v4
        with:
          name: security-dashboard
          path: |
            security-dashboard.json
            security-summary.md
          retention-days: 90

      - name: Send security notification
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          fields: repo,message,commit,author,action,workflow,ref,workflow_run
          text: "🔐 Security Scan: $CRITICAL critical, $HIGH high, $MEDIUM medium, $LOW low vulnerabilities"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # =============================================================================
  # Job 6: Security Integration with Code Analysis
  # =============================================================================
  security-integration:
    name: Security Integration
    runs-on: ubuntu-latest
    needs: [vulnerability-scan, license-compliance, dependency-policy]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download security artifacts
        uses: actions/download-artifact@v4
        with:
          name: security-dashboard

      - name: Integrate with GitHub Security Advisories
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const securityData = JSON.parse(fs.readFileSync('security-dashboard.json', 'utf8'));

            // Create or update GitHub security issue
            const issueTitle = `Security Scan Results - ${securityData.timestamp}`;
            const issueBody = `
            ## Security Scan Summary

            **Date**: ${securityData.timestamp}
            **Repository**: ${securityData.repository}
            **Commit**: ${securityData.commit}

            ### Vulnerability Count
            - Critical: ${securityData.security_status.critical}
            - High: ${securityData.security_status.high}
            - Medium: ${securityData.security_status.medium}
            - Low: ${securityData.security_status.low}

            ### Compliance Status
            - Licenses: ${securityData.compliance.licenses}
            - Policies: ${securityData.compliance.policies}

            ### Actions Required
            ${securityData.recommendations.map(r => `- ${r}`).join('\n')}
            `;

            // This would create a GitHub issue or update an existing one
            console.log('Security integration completed');

  # =============================================================================
  # Job 7: Security Cleanup and Archive
  # =============================================================================
  security-cleanup:
    name: Security Cleanup
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Archive security data
        run: |
          echo "🗄️ Archiving security data..."
          mkdir -p archived-security
          cp security-dashboard.json archived-security/

          # Keep last 30 days of security data
          find archived-security -name "*.json" -mtime +30 -delete

      - name: Clean up temporary files
        run: |
          sudo rm -rf /tmp/security-scan
          docker system prune -f

      - name: Display security summary
        run: |
          echo "=== Security Scan Summary ==="
          echo "Total scans completed: 4"
          echo "Artifacts generated: $(find . -name "*.json" -o -name "*.md" | wc -l)"
          echo "Retention period: 90 days for critical data"