apiVersion: v1
kind: Service
metadata:
  name: elrmcp-bridge-service
  namespace: elrmcp-bridge
  labels:
    app: elrmcp-bridge
spec:
  type: ClusterIP
  ports:
    - name: mcp
      port: 8091
      targetPort: 8091
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP
  selector:
    app: elrmcp-bridge