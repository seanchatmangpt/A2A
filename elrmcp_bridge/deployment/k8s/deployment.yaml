apiVersion: apps/v1
kind: Deployment
metadata:
  name: elrmcp-bridge
  namespace: elrmcp-bridge
  labels:
    app: elrmcp-bridge
spec:
  replicas: 2
  selector:
    matchLabels:
      app: elrmcp-bridge
  template:
    metadata:
      labels:
        app: elrmcp-bridge
    spec:
      containers:
        - name: elrmcp-bridge
          image: elrmcp-bridge:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8091
              name: mcp
              protocol: TCP
            - containerPort: 9090
              name: metrics
              protocol: TCP
          env:
            - name: CRAFTPLAN_URL
              value: "http://craftplan-mcp:8090"
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8091
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8091
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: config-volume
              mountPath: /etc/elrmcp-bridge
              readOnly: true
            - name: log-volume
              mountPath: /var/log/elrmcp-bridge
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
      volumes:
        - name: config-volume
          configMap:
            name: elrmcp-bridge-config
        - name: log-volume
          emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - elrmcp-bridge
                topologyKey: "kubernetes.io/hostname"
      tolerations:
        - key: "elrmcp"
          operator: "Equal"
          value: "bridge"
          effect: "NoSchedule"