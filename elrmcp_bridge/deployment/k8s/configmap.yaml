apiVersion: v1
kind: ConfigMap
metadata:
  name: elrmcp-bridge-config
  namespace: elrmcp-bridge
data:
  bridge.config: |
    {
      "elrmcp_bridge": {
        "version": "1.0.0",
        "description": "elrmcp MCP Bridge Configuration",

        "craftplan": {
          "url": "http://localhost:8090",
          "timeout": 30000,
          "auth_token": null
        },

        "rate_limiting": {
          "enabled": true,
          "requests_per_second": 100,
          "burst_size": 10,
          "refill_interval_ms": 1000
        },

        "tool_management": {
          "whitelist": [],
          "blacklist": [],
          "auto_register": true,
          "cache_ttl": 300000
        },

        "performance": {
          "enable_caching": true,
          "cache_size": 1000,
          "request_timeout": 30000,
          "connect_timeout": 5000
        },

        "logging": {
          "level": "info",
          "enable_metrics": true,
          "request_logging": true,
          "error_logging": true
        },

        "health_checks": {
          "enabled": true,
          "interval_ms": 30000,
          "timeout_ms": 5000
        },

        "security": {
          "validate_inputs": true,
          "sanitize_outputs": true,
          "max_request_size": 1048576,
          "allowed_origins": ["*"]
        }
      }
    }
  vm.args: |
    ## elrmcp Bridge VM Arguments
    ## Kernel
    +K true
    +zdbbl 128000

    ## Process Limits
    +P 1048576
    +A 64

    ## Scheduling
    +S 128
    +Q 65536

    ## Memory
    -heap_type optimal
    -hms 64 +hmsz 64 +hmtvm 128
    +hmbsz 32

    ## ETS
    +ets [file_table {read_concurrency true}]

    ## Logging
    -kernel logger '[{handler, default, logger_std_h,
                     #{formatter => {logger_formatter,
                                    #{single_line => true,
                                      legacy_header => false}}},
                     #{level => info}]}]'

    ## Crash Dump
    -crash_dump /tmp/elrmcp_bridge.crashdump

    ## Heart
    -heartbeat_interval 30
    -heartbeat_timeout 60