{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "elrmcp-bridge.fullname" . }}-network-policy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "elrmcp-bridge.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "elrmcp-bridge.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  {{- with .Values.networkPolicy.ingress }}
  ingress:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.networkPolicy.egress }}
  egress:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}