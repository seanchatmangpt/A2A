      max_agents: 10
      max_workflows: 20
      max_api_calls_per_day: 1000
      max_storage_gb: 10
      data_retention_days: 30
    features:
      core_platform: true
      basic_workflows: true
      api_access: true
      email_support: true
      phone_support: false
      sla_guarantee: false
      custom_integrations: false
      advanced_analytics: false
      multi_tenant: false
      sso: false
