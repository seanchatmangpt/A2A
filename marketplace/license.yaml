    features:
      core_platform: true
      basic_workflows: true
      advanced_workflows: false
      api_access: true
      email_support: true
      phone_support: false
      sla_guarantee: false
      custom_integrations: false
      advanced_analytics: false
      multi_tenant: false
      sso: false
