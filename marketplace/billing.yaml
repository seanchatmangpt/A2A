apiVersion: v1
kind: BillingConfiguration
metadata:
  name: gcp-marketplace-billing
  namespace: marketplace
  labels:
    component: billing
    provider: gcp
    version: v1

billing:
  enabled: true
  provider: google-cloud-platform

  # GCP Billing Account Configuration
  account:
    billingAccountId: "${GCP_BILLING_ACCOUNT_ID}"
    projectId: "${GCP_PROJECT_ID}"
    region: "${GCP_REGION:-us-central1}"

  # API Configuration
  api:
    endpoint: "https://cloudbilling.googleapis.com/v1"
    serviceName: "cloudbilling.googleapis.com"
    version: "v1"
    timeout: 30s
    retryAttempts: 3
    retryBackoff: exponential

  # Authentication
  authentication:
    type: service-account
    serviceAccountKeyPath: "${GCP_SERVICE_ACCOUNT_KEY_PATH}"
    scopes:
      - "https://www.googleapis.com/auth/cloud-billing"
      - "https://www.googleapis.com/auth/cloud-platform"
      - "https://www.googleapis.com/auth/monitoring"
      - "https://www.googleapis.com/auth/logging.write"

  # Cost Allocation
  costAllocation:
    enabled: true
    granularity: daily

    # Labels for cost tracking
    labels:
      environment: "${ENVIRONMENT}"
      team: "${TEAM_NAME}"
      application: "a2a-marketplace"
      cost-center: "${COST_CENTER}"
      department: "${DEPARTMENT}"
      project: "${PROJECT_NAME}"

    # Resource tagging
    tags:
      - key: "billing-code"
        value: "${BILLING_CODE}"
      - key: "owner"
        value: "${RESOURCE_OWNER}"
      - key: "managed-by"
        value: "a2a-platform"

    # Cost allocation rules
    rules:
      - name: "compute-costs"
        resource: "compute.googleapis.com"
        allocation: proportional
        splitBy: ["instance-id", "zone"]

      - name: "storage-costs"
        resource: "storage.googleapis.com"
        allocation: direct
        splitBy: ["bucket-name", "storage-class"]

      - name: "network-costs"
        resource: "compute.googleapis.com/network"
        allocation: usage-based
        splitBy: ["vpc-id", "subnet-id"]

      - name: "api-costs"
        resource: "servicecontrol.googleapis.com"
        allocation: per-request
        splitBy: ["api-name", "method"]

  # Budget Configuration
  budgets:
    enabled: true
    currency: USD

    limits:
      - name: "monthly-total"
        amount: 10000
        period: monthly
        alertThresholds: [50, 75, 90, 100]

      - name: "daily-compute"
        amount: 200
        period: daily
        scope: "compute.googleapis.com"
        alertThresholds: [80, 100]

      - name: "weekly-storage"
        amount: 1000
        period: weekly
        scope: "storage.googleapis.com"
        alertThresholds: [90, 100]

    # Alert configuration
    alerts:
      email:
        enabled: true
        recipients:
          - "${BILLING_ALERT_EMAIL}"
          - "${ADMIN_EMAIL}"
      slack:
        enabled: true
        webhook: "${SLACK_BILLING_WEBHOOK}"
        channel: "#billing-alerts"
      pubsub:
        enabled: true
        topic: "projects/${GCP_PROJECT_ID}/topics/billing-alerts"

  # Billing Export
  export:
    enabled: true

    # BigQuery export
    bigquery:
      enabled: true
      datasetId: "billing_export"
      tableId: "gcp_billing_export"
      location: "${GCP_REGION:-us-central1}"
      partitionType: day

    # Cloud Storage export
    cloudStorage:
      enabled: true
      bucket: "${GCP_BILLING_BUCKET}"
      prefix: "billing-export/"
      format: json
      compression: gzip
      schedule: "0 */6 * * *"  # Every 6 hours

    # File export for local analysis
    file:
      enabled: true
      path: "/var/billing/exports"
      format: csv
      schedule: "0 0 * * *"  # Daily at midnight

  # Metering Configuration
  metering:
    enabled: true
    reportingInterval: 1h
    batchSize: 1000
    bufferSize: 10000

    # Metric definitions
    metrics:
      - name: "api_requests"
        type: counter
        unit: "requests"
        description: "Number of API requests"
        labels: ["endpoint", "method", "status"]

      - name: "compute_hours"
        type: gauge
        unit: "hours"
        description: "Compute instance hours"
        labels: ["instance_type", "zone", "preemptible"]

      - name: "storage_bytes"
        type: gauge
        unit: "bytes"
        description: "Storage usage in bytes"
        labels: ["storage_class", "region"]

      - name: "network_egress"
        type: counter
        unit: "bytes"
        description: "Network egress in bytes"
        labels: ["destination", "protocol"]

      - name: "user_seats"
        type: gauge
        unit: "seats"
        description: "Active user seats"
        labels: ["license_type", "tier"]

    # Metering endpoints
    endpoints:
      submit: "${GCP_METERING_ENDPOINT:-https://servicecontrol.googleapis.com/v1/services}"
      report: "${GCP_METERING_ENDPOINT:-https://servicecontrol.googleapis.com/v1/services}:report"
      check: "${GCP_METERING_ENDPOINT:-https://servicecontrol.googleapis.com/v1/services}:check"

  # Pricing Configuration
  pricing:
    enabled: true
    model: usage-based

    # SKU definitions
    skus:
      - id: "compute-standard"
        name: "Standard Compute"
        unit: "hour"
        price: 0.05
        currency: USD
        tier: standard

      - id: "compute-premium"
        name: "Premium Compute"
        unit: "hour"
        price: 0.12
        currency: USD
        tier: premium

      - id: "storage-standard"
        name: "Standard Storage"
        unit: "GB-month"
        price: 0.02
        currency: USD
        tier: standard

      - id: "storage-archive"
        name: "Archive Storage"
        unit: "GB-month"
        price: 0.004
        currency: USD
        tier: archive

      - id: "api-calls"
        name: "API Calls"
        unit: "1000-requests"
        price: 0.001
        currency: USD
        tier: standard

      - id: "user-seat"
        name: "User Seat"
        unit: "seat-month"
        price: 25.00
        currency: USD
        tier: standard

    # Tiered pricing
    tiers:
      - name: "starter"
        includedUsage:
          compute_hours: 100
          storage_bytes: 10737418240  # 10 GB
          api_requests: 10000
        overageRates:
          compute_hours: 0.05
          storage_bytes: 0.00000002  # $0.02 per GB
          api_requests: 0.000001  # $0.001 per 1000

      - name: "professional"
        includedUsage:
          compute_hours: 500
          storage_bytes: 107374182400  # 100 GB
          api_requests: 100000
        overageRates:
          compute_hours: 0.04
          storage_bytes: 0.000000015
          api_requests: 0.0000008

      - name: "enterprise"
        includedUsage:
          compute_hours: 2000
          storage_bytes: 1099511627776  # 1 TB
          api_requests: 1000000
        overageRates:
          compute_hours: 0.03
          storage_bytes: 0.00000001
          api_requests: 0.0000005

  # Usage Quotas
  quotas:
    enabled: true
    enforcement: soft  # soft or hard

    limits:
      - resource: "compute_hours"
        limit: 10000
        period: monthly
        tier: standard

      - resource: "storage_bytes"
        limit: 10995116277760  # 10 TB
        period: monthly
        tier: standard

      - resource: "api_requests"
        limit: 10000000
        period: monthly
        tier: standard

      - resource: "network_egress"
        limit: 1099511627776  # 1 TB
        period: monthly
        tier: standard

    # Quota exceeded actions
    onExceeded:
      action: throttle  # throttle, block, or notify
      notification:
        email: true
        slack: true
        webhook: "${QUOTA_WEBHOOK_URL}"

  # Reporting
  reporting:
    enabled: true

    schedules:
      - name: "daily-summary"
        type: summary
        frequency: daily
        time: "09:00"
        recipients: ["${BILLING_REPORT_EMAIL}"]
        format: pdf

      - name: "weekly-detailed"
        type: detailed
        frequency: weekly
        day: monday
        time: "08:00"
        recipients: ["${BILLING_REPORT_EMAIL}", "${FINANCE_EMAIL}"]
        format: excel

      - name: "monthly-invoice"
        type: invoice
        frequency: monthly
        day: 1
        time: "00:00"
        recipients: ["${FINANCE_EMAIL}", "${ACCOUNTING_EMAIL}"]
        format: pdf

    # Report components
    components:
      - costByService
      - costByProject
      - costByLabel
      - usageByResource
      - budgetVsActual
      - forecast
      - recommendations

  # Cost Optimization
  optimization:
    enabled: true

    recommendations:
      - type: "rightsizing"
        threshold: 0.3  # 30% utilization
        action: recommend

      - type: "committed-use"
        minimumSavings: 0.2  # 20% savings
        action: recommend

      - type: "idle-resources"
        idleThreshold: 7  # days
        action: alert

    autoActions:
      enabled: false  # Manual approval required
      allowList:
        - "stop-idle-instances"
        - "delete-old-snapshots"

  # Logging
  logging:
    enabled: true
    level: info
    destination: stackdriver

    logFilters:
      - "billing.cost > 100"
      - "billing.budget.exceeded"
      - "billing.quota.warning"

    retention:
      days: 90
      archiveToStorage: true
      archiveBucket: "${GCP_LOGS_BUCKET}"

  # Monitoring
  monitoring:
    enabled: true

    metrics:
      - name: "billing.cost.total"
        aggregation: sum
        interval: 1h

      - name: "billing.budget.utilization"
        aggregation: avg
        interval: 1h

      - name: "billing.quota.usage"
        aggregation: max
        interval: 5m

    dashboards:
      - name: "billing-overview"
        url: "${MONITORING_DASHBOARD_URL}"

    alerts:
      - name: "high-cost-spike"
        condition: "billing.cost.hourly > 100"
        severity: warning

      - name: "budget-exceeded"
        condition: "billing.budget.utilization > 1.0"
        severity: critical
