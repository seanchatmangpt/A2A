# Technical Specifications
technical:
  protocol: "JSON-RPC 2.0"
  transport: "HTTP/HTTPS"
  supportedLanguages:
    - name: "Python"
      sdk: "a2a-sdk"
      packageManager: "pip"
      repository: "https://github.com/a2aproject/a2a-python"
    - name: "Go"
      sdk: "a2a-go"
      packageManager: "go get"
      repository: "https://github.com/a2aproject/a2a-go"
    - name: "JavaScript/TypeScript"
      sdk: "@a2a-js/sdk"
      packageManager: "npm"
      repository: "https://github.com/a2aproject/a2a-js"
    - name: "Java"
      sdk: "a2a-java"
      packageManager: "maven"
      repository: "https://github.com/a2aproject/a2a-java"
    - name: ".NET"
      sdk: "A2A"
      packageManager: "nuget"
      repository: "https://github.com/a2aproject/a2a-dotnet"
    - name: "Erlang"
      sdk: "a2a_erl"
      packageManager: "rebar3"
      repository: "https://github.com/a2aproject/A2A/tree/main/erlang"

  gcpIntegration:
    services:
      - "Compute Engine"
      - "Google Kubernetes Engine (GKE)"
      - "Cloud Run"
      - "Cloud Functions"
      - "Vertex AI"
      - "Cloud Load Balancing"
      - "Cloud Logging"
      - "Cloud Monitoring"
      - "Secret Manager"
      - "Cloud Storage"

    authentication:
      - "OAuth 2.0"
      - "API Keys"
      - "Service Accounts"
      - "Workload Identity"

    deployment:
      - type: "Kubernetes"
        helm: true
        helmRepository: "https://github.com/a2aproject/A2A/tree/main/infrastructure/kubernetes/helm"
      - type: "Docker"
        container: true
        registry: "gcr.io/a2a-protocol"
      - type: "Cloud Run"
        managed: true

