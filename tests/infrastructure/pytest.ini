[pytest]
# Pytest configuration for infrastructure tests

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = .

# Markers
markers =
    network_policy: tests for Kubernetes network policies
    firewall: tests for GCP firewall rules
    vpc: tests for VPC connectivity
    cloud_armor: tests for Cloud Armor security policies
    integration: integration tests requiring live infrastructure
    slow: slow running tests

# Output options
addopts =
    --strict-markers
    --strict-config
    --verbose
    --tb=short
    --disable-warnings

# Timeout for slow tests
timeout = 300

# Coverage options
[coverage:run]
source = .
omit =
    */tests/*
    */conftest.py
    */__pycache__/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
