# Default values for a2a-erl
replicaCount: 1

# Number of old ReplicaSets to retain for rollback
revisionHistoryLimit: 10

# Rolling update configuration
rollingUpdate:
  maxSurge: 25%
  maxUnavailable: 0

image:
  repository: a2a-erl
  pullPolicy: IfNotPresent
  tag: "0.1.0"

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 1000
  runAsNonRoot: true
  runAsUser: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

service:
  type: ClusterIP
  port: 8080
  annotations: {}

ingress:
  enabled: false
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/websocket-services: "a2a-service"
  hosts:
    - host: a2a.local
      paths:
        - path: /health
          pathType: Exact
        - path: /metrics
          pathType: Exact
        - path: /.well-known/agent-card.json
          pathType: Exact
        - path: /message:send
          pathType: Exact
        - path: /message:stream
          pathType: Exact
        - path: /tasks
          pathType: Exact
        - path: /tasks/
          pathType: Prefix
        - path: /extendedAgentCard
          pathType: Exact
  tls: []

resources:
  limits:
    cpu: 2000m
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# Erlang/OTP specific configuration
erlang:
  nodeName: a2a
  cookie: a2a_cookie
  # Cookie must match across all environments for consistent clustering
  distribution: name
  smp: "4:4"
  maxPorts: 65536
  maxProcesses: 1000000
  asyncThreads: 64

# Secret configuration
secret:
  create: true
  # If create is false, provide an existing secret name
  existingSecret: ""

# Application specific configuration
app:
  port: 8080
  host: localhost
  scheme: http
  logLevel: info

# Health check configuration
healthCheck:
  enabled: true
  path: /health
  initialDelaySeconds: 30
  periodSeconds: 30
  timeoutSeconds: 10
  successThreshold: 1
  failureThreshold: 3

# Test configuration
tests:
  enabled: true

# Persistence configuration
persistence:
  enabled: false
  data:
    enabled: false
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 1Gi
  log:
    enabled: false
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 500Mi
