apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "a2a-erl.fullname" . }}-config
  labels:
    {{- include "a2a-erl.labels" . | nindent 4 }}
data:
  vm.args: |
    ## Enable SMP
    +S {{ .Values.erlang.smp | default "4:4" }}

    ## Increase number of concurrent ports/sockets
    +Q {{ .Values.erlang.maxPorts | default 65536 }}

    ## Increase process count
    +P {{ .Values.erlang.maxProcesses | default 1000000 }}

    ## Enable kernel poll
    +K true

    ## Use async threads
    +A {{ .Values.erlang.asyncThreads | default 64 }}

    ## Garbage collection
    +hms 233

    ## Allocator settings for memory efficiency
    +MBas aobf
    +MBlmbcs 512
    +MEas aobf

  sys.config: |
    [
      {a2a_erl, [
        {port, {{ .Values.app.port }}},
        {host, "{{ .Values.app.host }}"},
        {scheme, "{{ .Values.app.scheme }}"}
      ]},

      {kernel, [
        {logger_level, {{ .Values.app.logLevel }}},
        {logger, [
          {handler, default, logger_std_h,
            #{level => {{ .Values.app.logLevel }},
              formatter => {logger_formatter, #{
                single_line => true,
                template => [time, " ", level, " ", msg, "\n"]
              }}
            }
          }
        ]}
      ]},

      {sasl, [
        {sasl_error_logger, false}
      ]}
    ].
