{{- if .Values.persistence.enabled }}
{{- if .Values.persistence.data.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "a2a-erl.fullname" . }}-data
  labels:
    {{- include "a2a-erl.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.persistence.data.accessMode }}
  {{- if .Values.persistence.data.storageClass }}
  storageClassName: {{ .Values.persistence.data.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.data.size }}
---
{{- end }}
{{- if .Values.persistence.log.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "a2a-erl.fullname" . }}-log
  labels:
    {{- include "a2a-erl.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.persistence.log.accessMode }}
  {{- if .Values.persistence.log.storageClass }}
  storageClassName: {{ .Values.persistence.log.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.log.size }}
---
{{- end }}
{{- end }}
