apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "a2a-erl.fullname" . }}
  labels:
    {{- include "a2a-erl.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit | default 10 }}
  selector:
    matchLabels:
      {{- include "a2a-erl.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ .Values.rollingUpdate.maxSurge | default "25%" }}
      maxUnavailable: {{ .Values.rollingUpdate.maxUnavailable | default 0 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "a2a-erl.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "a2a-erl.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
      - name: {{ .Chart.Name }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 12 }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command: ["/bin/sh", "-c"]
        args:
        - |
          export RELEASE_NODE=${ERLANG_NODE}@$(hostname -i)
          export RELEASE_COOKIE={{ .Values.erlang.cookie }}
          echo "Starting A2A Erlang Application..."
          echo "Node: ${RELEASE_NODE}"
          echo "Port: ${PORT}"
          exec /opt/a2a_erl/bin/a2a_erl foreground
        ports:
        - name: http
          containerPort: {{ .Values.app.port }}
          protocol: TCP
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: ERLANG_NODE
          value: {{ .Values.erlang.nodeName }}
        - name: RELEASE_COOKIE
          value: {{ .Values.erlang.cookie }}
        - name: RELEASE_DISTRIBUTION
          value: {{ .Values.erlang.distribution }}
        - name: PORT
          value: {{ .Values.app.port | quote }}
        - name: HOST
          value: {{ .Values.app.host }}
        - name: SCHEME
          value: {{ .Values.app.scheme }}
        - name: ERL_MAX_PORTS
          value: "65536"
        - name: ERL_MAX_ETS_TABLES
          value: "2000"
        {{- if .Values.healthCheck.enabled }}
        livenessProbe:
          httpGet:
            path: {{ .Values.healthCheck.path }}
            port: http
          initialDelaySeconds: {{ .Values.healthCheck.initialDelaySeconds }}
          periodSeconds: {{ .Values.healthCheck.periodSeconds }}
          timeoutSeconds: {{ .Values.healthCheck.timeoutSeconds }}
          successThreshold: {{ .Values.healthCheck.successThreshold }}
          failureThreshold: {{ .Values.healthCheck.failureThreshold }}
        readinessProbe:
          httpGet:
            path: {{ .Values.healthCheck.path }}
            port: http
          initialDelaySeconds: {{ .Values.healthCheck.initialDelaySeconds }}
          periodSeconds: {{ .Values.healthCheck.periodSeconds }}
          timeoutSeconds: {{ .Values.healthCheck.timeoutSeconds }}
          successThreshold: {{ .Values.healthCheck.successThreshold }}
          failureThreshold: {{ .Values.healthCheck.failureThreshold }}
        {{- end }}
        resources:
          {{- toYaml .Values.resources | nindent 12 }}
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: log
          mountPath: /opt/a2a_erl/log
        {{- if .Values.persistence.data.enabled }}
        - name: data
          mountPath: /opt/a2a_erl/data
        {{- end }}
      volumes:
      - name: tmp
        emptyDir: {}
      {{- if .Values.persistence.log.enabled }}
      - name: log
        persistentVolumeClaim:
          claimName: {{ include "a2a-erl.fullname" . }}-log
      {{- else }}
      - name: log
        emptyDir: {}
      {{- end }}
      {{- if .Values.persistence.data.enabled }}
      - name: data
        persistentVolumeClaim:
          claimName: {{ include "a2a-erl.fullname" . }}-data
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
