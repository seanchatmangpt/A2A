{{- if .Values.tests.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "a2a-erl.fullname" . }}-test-configmap-secret
  labels:
    {{- include "a2a-erl.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
  - name: config-test
    image: busybox:1.36
    command: ['sh', '-c']
    args:
    - |
      set -e
      echo "=== A2A Helm ConfigMap and Secret Test ==="
      echo ""
      echo "1. Testing ConfigMap volume mount..."
      echo "Config directory contents:"
      ls -la /opt/a2a_erl/config/
      echo ""
      echo "2. Testing vm.args file readability..."
      if [ -f /opt/a2a_erl/config/vm.args ]; then
        echo "vm.args content:"
        cat /opt/a2a_erl/config/vm.args
      else
        echo "ERROR: vm.args file not found!"
        exit 1
      fi
      echo ""
      echo "3. Testing sys.config file readability..."
      if [ -f /opt/a2a_erl/config/sys.config ]; then
        echo "sys.config content:"
        cat /opt/a2a_erl/config/sys.config
      else
        echo "ERROR: sys.config file not found!"
        exit 1
      fi
      echo ""
      echo "4. Testing Secret from environment variable..."
      echo "RELEASE_COOKIE=${RELEASE_COOKIE:0:8}..."  # Show only first 8 chars
      if [ -z "$RELEASE_COOKIE" ]; then
        echo "ERROR: RELEASE_COOKIE environment variable not set!"
        exit 1
      else
        echo "RELEASE_COOKIE is set successfully."
      fi
      echo ""
      echo "5. Testing other environment variables..."
      echo "PORT=${PORT}"
      echo "HOST=${HOST}"
      echo "SCHEME=${SCHEME}"
      echo "ERLANG_NODE=${ERLANG_NODE}"
      echo "RELEASE_DISTRIBUTION=${RELEASE_DISTRIBUTION}"
      echo ""
      echo "6. Verifying expected values..."
      [ "${PORT}" = "{{ .Values.app.port }}" ] || { echo "ERROR: PORT mismatch"; exit 1; }
      [ "${HOST}" = "{{ .Values.app.host }}" ] || { echo "ERROR: HOST mismatch"; exit 1; }
      [ "${SCHEME}" = "{{ .Values.app.scheme }}" ] || { echo "ERROR: SCHEME mismatch"; exit 1; }
      echo "All environment variables match expected values."
      echo ""
      echo "=== All Tests Passed ==="
    env:
    - name: RELEASE_COOKIE
      valueFrom:
        secretKeyRef:
          name: {{ include "a2a-erl.fullname" . }}-secret
          key: erlang-cookie
    - name: PORT
      value: {{ .Values.app.port | quote }}
    - name: HOST
      value: {{ .Values.app.host }}
    - name: SCHEME
      value: {{ .Values.app.scheme }}
    - name: ERLANG_NODE
      value: {{ .Values.erlang.nodeName }}
    - name: RELEASE_DISTRIBUTION
      value: {{ .Values.erlang.distribution }}
    volumeMounts:
    - name: config
      mountPath: /opt/a2a_erl/config
      readOnly: true
  volumes:
  - name: config
    configMap:
      name: {{ include "a2a-erl.fullname" . }}-config
{{- end }}
