# Full featured deployment test
replicaCount: 3

image:
  repository: a2a-erl
  tag: "0.1.0"
  pullPolicy: Always

imagePullSecrets:
  - name: regcred

nameOverride: "a2a"
fullnameOverride: "production-a2a"

serviceAccount:
  create: true
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::123456789012:role/a2a-prod"

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/metrics"

service:
  type: ClusterIP
  port: 8080
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rate-limit: "100"
  hosts:
    - host: a2a.example.com
      paths:
        - path: /
          pathType: Prefix
    - host: api.a2a.example.com
      paths:
        - path: /api
          pathType: Prefix
  tls:
    - secretName: a2a-tls
      hosts:
        - a2a.example.com
        - api.a2a.example.com

resources:
  limits:
    cpu: 2000m
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: 80

nodeSelector:
  workload: a2a

tolerations:
  - key: "dedicated"
    operator: "Equal"
    value: "a2a"
    effect: "NoSchedule"
  - key: "critical"
    operator: "Exists"
    effect: "NoExecute"

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - a2a
          topologyKey: kubernetes.io/hostname

erlang:
  nodeName: a2a_prod
  cookie: prod_secure_cookie_change_me

app:
  port: 8080
  host: 0.0.0.0
  scheme: https
  logLevel: info

healthCheck:
  enabled: true
  path: /.well-known/agent-card.json
  initialDelaySeconds: 30
  periodSeconds: 30
  timeoutSeconds: 10
  successThreshold: 1
  failureThreshold: 3
