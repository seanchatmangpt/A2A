# Image pull secrets test
replicaCount: 1

image:
  repository: private-registry.example.com/a2a-erl
  tag: "0.1.0"
  pullPolicy: Always

imagePullSecrets:
  - name: regcred
  - name: gcr-key

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: false

ingress:
  enabled: false
