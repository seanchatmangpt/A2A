# Custom port configuration test
replicaCount: 1

image:
  repository: a2a-erl
  tag: "0.1.0"

service:
  type: ClusterIP
  port: 9000
  annotations: {}

app:
  port: 9000
  host: 0.0.0.0
  scheme: https
  logLevel: debug

erlang:
  nodeName: custom_a2a
  cookie: custom_secret_cookie
  distribution: sname

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: false

ingress:
  enabled: false

healthCheck:
  enabled: true
  path: /health
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  successThreshold: 1
  failureThreshold: 5
