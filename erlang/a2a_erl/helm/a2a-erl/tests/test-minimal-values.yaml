# Minimal values test - single replica, no autoscaling, no ingress
replicaCount: 1

image:
  repository: a2a-erl
  tag: "0.1.0"

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

autoscaling:
  enabled: false

ingress:
  enabled: false

healthCheck:
  enabled: true

tests:
  enabled: false
