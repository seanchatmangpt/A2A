# =============================================================================
# OTP Version Matrix Test
# =============================================================================
# Tests multiple OTP versions with different test configurations
# Validates matrix strategy spawns all combinations correctly
# =============================================================================

name: OTP Matrix Test

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  # -----------------------------------------------------------------------------
  # OTP Version Matrix Test
  # -----------------------------------------------------------------------------
  otp-matrix:
    name: OTP ${{ matrix.otp_version }} - ${{ matrix.test_type }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        otp_version: [26, 27, 28]
        test_type: [compile, xref, dialyzer]
        exclude:
          # Exclude dialyzer on OTP 26 (slower)
          - otp_version: 26
            test_type: dialyzer

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Erlang/OTP
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp_version }}

      - name: Display environment
        run: |
          echo "=== Matrix Configuration ==="
          echo "OTP Version: ${{ matrix.otp_version }}"
          echo "Test Type: ${{ matrix.test_type }}"
          echo ""
          echo "=== Runtime Environment ==="
          erl -eval 'io:format("OTP Release: ~s~nERTS Version: ~s~n", [erlang:system_info(otp_release), erlang:system_info(version)]), halt().' -noshell

      - name: Compile
        run: rebar3 compile

      - name: Run xref
        if: matrix.test_type == 'xref'
        run: rebar3 xref || echo "xref completed with warnings"

      - name: Run dialyzer
        if: matrix.test_type == 'dialyzer'
        run: rebar3 dialyzer || echo "dialyzer completed with warnings"

  # -----------------------------------------------------------------------------
  # Matrix Summary
  # -----------------------------------------------------------------------------
  summary:
    name: Matrix Summary
    runs-on: ubuntu-latest
    needs: otp-matrix
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "## OTP Matrix Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Expected Matrix Jobs" >> $GITHUB_STEP_SUMMARY
          echo "| OTP Version | Test Type |" >> $GITHUB_STEP_SUMMARY
          echo "|-------------|-----------|" >> $GITHUB_STEP_SUMMARY
          echo "| 26 | compile |" >> $GITHUB_STEP_SUMMARY
          echo "| 26 | xref |" >> $GITHUB_STEP_SUMMARY
          echo "| 27 | compile |" >> $GITHUB_STEP_SUMMARY
          echo "| 27 | xref |" >> $GITHUB_STEP_SUMMARY
          echo "| 27 | dialyzer |" >> $GITHUB_STEP_SUMMARY
          echo "| 28 | compile |" >> $GITHUB_STEP_SUMMARY
          echo "| 28 | xref |" >> $GITHUB_STEP_SUMMARY
          echo "| 28 | dialyzer |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Total: 8 matrix jobs (2 excluded from 10 possible)" >> $GITHUB_STEP_SUMMARY
