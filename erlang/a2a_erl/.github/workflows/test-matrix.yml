# =============================================================================
# Test Matrix Strategy - Local Testing with act
# =============================================================================
# Simple workflow to verify matrix jobs spawn correctly
# Tests multiple OTP versions and test types
# =============================================================================

name: Test Matrix Strategy

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  REBAR3_VERSION: "3.24.0"

jobs:
  # -----------------------------------------------------------------------------
  # Test Matrix with Multiple OTP Versions
  # -----------------------------------------------------------------------------
  test-matrix:
    name: Test (OTP ${{ matrix.otp_version }}, ${{ matrix.test_type }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        otp_version: [26, 27, 28]
        test_type: [compile, unit]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Erlang/OTP ${{ matrix.otp_version }}
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp_version }}
          rebar3-version: ${{ env.REBAR3_VERSION }}

      - name: Show environment
        run: |
          echo "Matrix Configuration:"
          echo "  OTP Version: ${{ matrix.otp_version }}"
          echo "  Test Type: ${{ matrix.test_type }}"
          echo ""
          echo "Runtime Environment:"
          erl -eval 'io:format("OTP ~s~n", [erlang:system_info(otp_release)]), halt().' -noshell
          rebar3 version

      - name: Compile application
        run: |
          rebar3 compile

      - name: Run compile check
        if: matrix.test_type == 'compile'
        run: |
          echo "Running compile check for OTP ${{ matrix.otp_version }}"
          rebar3 compile --warnings_as_errors || true

      - name: Run unit tests
        if: matrix.test_type == 'unit'
        run: |
          echo "Running unit tests for OTP ${{ matrix.otp_version }}"
          rebar3 ct --verbose || true

  # -----------------------------------------------------------------------------
  # Summary Job - Runs after all matrix jobs
  # -----------------------------------------------------------------------------
  matrix-summary:
    name: Matrix Summary
    runs-on: ubuntu-latest
    needs: test-matrix
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "## Matrix Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Expected Jobs" >> $GITHUB_STEP_SUMMARY
          echo "- OTP 26 + compile" >> $GITHUB_STEP_SUMMARY
          echo "- OTP 26 + unit" >> $GITHUB_STEP_SUMMARY
          echo "- OTP 27 + compile" >> $GITHUB_STEP_SUMMARY
          echo "- OTP 27 + unit" >> $GITHUB_STEP_SUMMARY
          echo "- OTP 28 + compile" >> $GITHUB_STEP_SUMMARY
          echo "- OTP 28 + unit" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Total: 6 matrix jobs" >> $GITHUB_STEP_SUMMARY
