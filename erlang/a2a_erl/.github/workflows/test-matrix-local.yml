# =============================================================================
# Simple Matrix Test for Local Execution with act
# =============================================================================
# Tests OTP 28 matrix with different test types
# Uses container-based execution for local testing
# =============================================================================

name: Matrix Local Test

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

env:
  REBAR3_VERSION: "3.24.0"

jobs:
  # -----------------------------------------------------------------------------
  # Simple Matrix Test
  # -----------------------------------------------------------------------------
  test-matrix:
    name: Test ${{ matrix.test_name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - test_name: "compile"
            test_cmd: "rebar3 compile"
          - test_name: "xref"
            test_cmd: "rebar3 xref || true"
          - test_name: "dialyzer"
            test_cmd: "rebar3 dialyzer || true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show matrix values
        run: |
          echo "Matrix test_name: ${{ matrix.test_name }}"
          echo "Matrix test_cmd: ${{ matrix.test_cmd }}"

      - name: Setup Erlang/OTP
        uses: erlef/setup-beam@v1
        with:
          otp-version: '28'
          rebar3-version: ${{ env.REBAR3_VERSION }}

      - name: Show OTP version
        run: |
          echo "OTP Version:"
          erl -eval 'io:format("OTP ~s~n", [erlang:system_info(otp_release)]), halt().' -noshell
          echo ""
          echo "Rebar3 Version:"
          rebar3 version

      - name: Run test command
        run: echo "=== Running ${{ matrix.test_name }} ===" && ${{ matrix.test_cmd }}

  # -----------------------------------------------------------------------------
  # Summary Job
  # -----------------------------------------------------------------------------
  summary:
    name: Execution Summary
    runs-on: ubuntu-latest
    needs: test-matrix
    if: always()

    steps:
      - name: Show results
        run: |
          echo "## Matrix Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Jobs Completed" >> $GITHUB_STEP_SUMMARY
          echo "- compile: Build and compile" >> $GITHUB_STEP_SUMMARY
          echo "- xref: Cross-reference check" >> $GITHUB_STEP_SUMMARY
          echo "- dialyzer: Static analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Total: 3 matrix jobs executed" >> $GITHUB_STEP_SUMMARY
