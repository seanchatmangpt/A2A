---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: a2a-ingress
  namespace: a2a-system
  labels:
    app: a2a-erl
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/websocket-services: "a2a-service"
spec:
  ingressClassName: nginx
  rules:
  - host: a2a.local
    http:
      paths:
      # Health check endpoints
      - path: /health
        pathType: Exact
        backend:
          service:
            name: a2a-service
            port:
              number: 8080
      - path: /metrics
        pathType: Exact
        backend:
          service:
            name: a2a-service
            port:
              number: 8080
      # Agent card and A2A protocol endpoints - catch-all with regex
      # Using a catch-all path to handle all endpoints including those with special characters
      - path: /
        pathType: Prefix
        backend:
          service:
            name: a2a-service
            port:
              number: 8080
  # Optional: TLS configuration
  # tls:
  # - hosts:
  #   - a2a.local
  #   secretName: a2a-tls-secret
