---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: a2a-data-pvc
  namespace: a2a-system
  labels:
    app: a2a-erl
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: a2a-log-pvc
  namespace: a2a-system
  labels:
    app: a2a-erl
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 500Mi
