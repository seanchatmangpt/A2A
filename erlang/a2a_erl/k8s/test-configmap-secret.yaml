---
# Test Pod to verify ConfigMap and Secret mounting
apiVersion: v1
kind: Pod
metadata:
  name: a2a-config-test
  namespace: a2a-system
  labels:
    app: a2a-config-test
spec:
  restartPolicy: Never
  containers:
  - name: config-test
    image: busybox:1.36
    command: ['sh', '-c']
    args:
    - |
      echo "=== A2A ConfigMap and Secret Test ===" && \
      echo "" && \
      echo "1. Testing ConfigMap volume mount..." && \
      echo "Config directory contents:" && \
      ls -la /opt/a2a_erl/config/ && \
      echo "" && \
      echo "2. Testing vm.args file readability..." && \
      if [ -f /opt/a2a_erl/config/vm.args ]; then \
        echo "vm.args content:" && \
        cat /opt/a2a_erl/config/vm.args; \
      else \
        echo "ERROR: vm.args file not found!"; \
        exit 1; \
      fi && \
      echo "" && \
      echo "3. Testing sys.config file readability..." && \
      if [ -f /opt/a2a_erl/config/sys.config ]; then \
        echo "sys.config content:" && \
        cat /opt/a2a_erl/config/sys.config; \
      else \
        echo "ERROR: sys.config file not found!"; \
        exit 1; \
      fi && \
      echo "" && \
      echo "4. Testing Secret from environment variable..." && \
      echo "RELEASE_COOKIE=${RELEASE_COOKIE}" && \
      if [ -z "$RELEASE_COOKIE" ]; then \
        echo "ERROR: RELEASE_COOKIE environment variable not set!"; \
        exit 1; \
      else \
        echo "RELEASE_COOKIE is set successfully."; \
      fi && \
      echo "" && \
      echo "5. Testing other environment variables..." && \
      echo "PORT=${PORT}" && \
      echo "HOST=${HOST}" && \
      echo "SCHEME=${SCHEME}" && \
      echo "" && \
      echo "6. Testing ConfigMap via environment (optional)..." && \
      echo "ConfigMap entries can also be accessed via envFrom if needed." && \
      echo "" && \
      echo "=== All Tests Passed ===" && \
      sleep 10
    env:
    - name: RELEASE_COOKIE
      valueFrom:
        secretKeyRef:
          name: a2a-secret
          key: erlang-cookie
    - name: PORT
      value: "8080"
    - name: HOST
      value: "0.0.0.0"
    - name: SCHEME
      value: "http"
    volumeMounts:
    - name: config
      mountPath: /opt/a2a_erl/config
      readOnly: true
  volumes:
  - name: config
    configMap:
      name: a2a-config
