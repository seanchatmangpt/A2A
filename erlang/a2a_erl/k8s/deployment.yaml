apiVersion: apps/v1
kind: Deployment
metadata:
  name: a2a-deployment
  namespace: a2a-system
  labels:
    app: a2a-erl
    version: v0.1.0
spec:
  replicas: 2
  selector:
    matchLabels:
      app: a2a-erl
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: a2a-erl
        version: v0.1.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: a2a-service-account
      containers:
      - name: a2a-erl
        image: a2a-erl:runtime
        imagePullPolicy: IfNotPresent
        command: ['/bin/sh', '-c']
        args: ['export RELEASE_NODE="a2a@${POD_IP}" && export RELEASE_COOKIE="a2a_cluster_cookie" && export PORT="8080" && export HOST="0.0.0.0" && export SCHEME="http" && echo "Starting with RELEASE_NODE=$RELEASE_NODE" && cd /opt/a2a_erl && exec bin/a2a_erl foreground']
        env:
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        - name: epmd
          containerPort: 4369
          protocol: TCP
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /.well-known/agent-card.json
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /.well-known/agent-card.json
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /.well-known/agent-card.json
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 12
      restartPolicy: Always
      dnsPolicy: ClusterFirst
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: a2a-hpa
  namespace: a2a-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: a2a-deployment
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 2
        periodSeconds: 30
      selectPolicy: Max
