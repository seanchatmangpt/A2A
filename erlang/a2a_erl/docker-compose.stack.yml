      PORT: 8080
      HOST: 0.0.0.0
      SCHEME: http
      ERL_MAX_PORTS: 65536
      ERL_MAX_ETS_TABLES: 2000
      # Bind EPMD to all interfaces
      ERL_EPMD_ADDRESS: 127.0.0.1
      ERL_AFLAGS: "-proto_dist inet_tcp"
    networks:
      - a2a-overlay
    deploy:
      mode: replicated
      replicas: 1
      placement:
