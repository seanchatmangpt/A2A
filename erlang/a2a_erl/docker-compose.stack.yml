          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
      endpoint_mode: dnsrr

  # -------------------------------------------------------------------------
  # Service Discovery Test Container
  # -------------------------------------------------------------------------
  discovery-test:
    image: nicolaka/netshoot:latest
    command: /bin/sh -c "sleep 3600"
    networks:
      - a2a-overlay
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: none

# =============================================================================
# Networks - Overlay for multi-host communication
# =============================================================================
networks:
  a2a-overlay:
    driver: overlay
    attachable: true
    ipam:
      driver: default
      config:
        - subnet: 10.10.0.0/24
