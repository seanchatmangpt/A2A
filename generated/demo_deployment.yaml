apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-a2a-erl
  namespace: a2a-system
  labels:
    app: a2a-erl
    component: application
    version: v0.2.0
spec:
  replicas: 3
  selector:
    matchLabels:
      app: a2a-erl
  template:
    metadata:
      labels:
        app: a2a-erl
        component: application
        version: v0.2.0
    spec:
      serviceAccountName: a2a-service-account
      containers:
      - name: a2a-erl
        image: ghcr.io/a2a/a2a-erl:v0.2.0
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
